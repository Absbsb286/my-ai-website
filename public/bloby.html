<script>
(function(){
'use strict';

const W = 400, H = 700;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const roomInput = document.getElementById('roomInput');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width  = (W*s)+'px';
  canvas.style.height = (H*s)+'px';
  canvas.width  = Math.round(W*s*dpr);
  canvas.height = Math.round(H*s*dpr);
  ctx.setTransform(s*dpr, 0, 0, s*dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize, 200));
resize();

/* ============================================================
   SEEDED RNG
   ============================================================ */
let rngState = 1;
function setSeed(s){ rngState = (s|0) || 1; }
function rng(){
  rngState = (rngState * 1664525 + 1013904223) >>> 0;
  return rngState / 4294967296;
}
function rngRange(a,b){ return a + rng()*(b-a); }

/* ---------- Constants ---------- */
const GRAV=2300, JUMP_V=-830, MOVE_SPEED=440, MAX_FALL=1900;
const COINS_NEEDED=17, POWER_DURATION=17, POWER_JUMP=1.5;
const START_Y=H-170, POWER_TEXT_DUR=2.5;
const DOUBLE_JUMP_V=-680;
const RACE_TIME = 90;

// REK 2 (Impeccable): tombol gerak lebih besar HANYA di mobile.
const BTN_R  = isTouch ? 56 : 42;
const BTN_Y  = H - (isTouch ? 88 : 78);
const BTN_LX = isTouch ? 82 : 66;
const BTN_RX = W - (isTouch ? 82 : 66);
const PAUSE_BTN = { x: W/2 - 20, y: 12, w: 40, h: 40 };

const BONUS_LAST_STANDING = 100;
const BONUS_WINNER = 50;

/* ---------- Settings ---------- */
let settings = { music:true, sfx:true, haptic:true };
try{ const s = localStorage.getItem('blobby_settings'); if(s) Object.assign(settings, JSON.parse(s)); }catch(e){}
function saveSettings(){ try{ localStorage.setItem('blobby_settings', JSON.stringify(settings)); }catch(e){} }

/* ---------- Skins ---------- */
const SKINS = [
  { id:'classic',  name:'Classic',   cost:0,    colors:['#b3ecff','#5b8cf7','#3a4fd8'] },
  { id:'ninja',    name:'Ninja',     cost:500,  colors:['#5a5a5a','#2a2a2a','#0a0a0a'] },
  { id:'astro',    name:'Astronot',  cost:1000, colors:['#FFF7E0','#d0d8e0','#8090a0'] },
  { id:'chef',     name:'Chef',      cost:1500, colors:['#FFF7E0','#f0f0f0','#d62828'] },
  { id:'detektif', name:'Detektif',  cost:2000, colors:['#d8b57a','#8a5a2b','#4a2e10'] }
];
let totalCoins = 0, unlockedSkins = ['classic'], selectedSkin = 'classic';
try{ totalCoins = parseInt(localStorage.getItem('blobby_coins')||'0',10)||0; }catch(e){}
try{ const s = localStorage.getItem('blobby_skins'); if(s) unlockedSkins = JSON.parse(s);
     if(!unlockedSkins.includes('classic')) unlockedSkins.unshift('classic'); }catch(e){}
try{ const s = localStorage.getItem('blobby_skin'); if(s && unlockedSkins.includes(s)) selectedSkin = s; }catch(e){}
function saveSkins(){
  try{
    localStorage.setItem('blobby_coins', String(totalCoins));
    localStorage.setItem('blobby_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('blobby_skin', selectedSkin);
  }catch(e){}
}
function getSkin(id){ return SKINS.find(s=>s.id===id) || SKINS[0]; }

let myName = '';
try{ myName = localStorage.getItem('blobby_name') || ''; }catch(e){}
if (!myName){
  myName = 'Pemain' + Math.floor(Math.random()*9000+1000);
  try{ localStorage.setItem('blobby_name', myName); }catch(e){}
}

function haptic(p){ if(!settings.haptic || !navigator.vibrate) return; try{ navigator.vibrate(p); }catch(e){} }

/* ============================================================
   JELLY COLORS — Infinity Stone palette
   ============================================================ */
const JELLY_COLORS = [
  { light:'#ff9eb5', mid:'#ff2d55', dark:'#8a0020', glow:'255,45,85',   name:'Reality'  }, // Merah
  { light:'#ffe999', mid:'#ffcc00', dark:'#8a6c00', glow:'255,204,0',   name:'Mind'     }, // Kuning
  { light:'#a8e1ff', mid:'#00a8ff', dark:'#004f8a', glow:'0,168,255',   name:'Space'    }, // Biru
  { light:'#a8ffd0', mid:'#00ff88', dark:'#008a48', glow:'0,255,136',   name:'Time'     }, // Hijau
  { light:'#dcb0ff', mid:'#a855f7', dark:'#5a1e9e', glow:'168,85,247',  name:'Power'    }, // Ungu
  { light:'#ffc78a', mid:'#ff8800', dark:'#8a4a00', glow:'255,136,0',   name:'Soul'     }  // Oranye
];

/* ============================================================
   NETWORK — Trystero
   ============================================================ */
const net = {
  mode: 'solo',
  room: null,
  actions: {},
  roomCode: '',
  myId: 'p' + Math.random().toString(36).substr(2, 10),
  players: {},
  connected: false,
  status: '',
  lastSend: 0,
  connecting: false,
  isHost: false,
  peerIdToPlayerId: {},
  module: null,
  heartbeat: null
};

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

/* ---------- EMQX Serverless broker (replaces Trystero's default public relays) ----------
   Trystero 0.21.3 has no separate username/password option for the broker:
   credentials are embedded in the relay URL (wss://user:pass@host:port/path).
   mqtt.js parses them out of the URL and sends them in the MQTT CONNECT
   packet; the WebSocket connection itself carries no credentials. */
const EMQX_WS_URL =
  'wss://blobbyuser:BlobbyJelly2026!@c616191f.ala.asia-southeast1.emqxsl.com:8084/mqtt';
const EMQX_ROOM_CONFIG = {
  appId: 'blobby-jelly-v1',
  relayUrls: [EMQX_WS_URL],
  rtcConfig: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      {
        urls: [
          'turn:turn.evan-brass.net:3478?transport=udp',
          'turn:turn.evan-brass.net:3478?transport=tcp'
        ],
        username: 'user',
        credential: 'password'
      }
    ]
  }
};

async function loadTrystero(){
  if (net.module) return net.module;
  try {
    net.module = await import('https://unpkg.com/trystero@0.21.3/mqtt');
    return net.module;
  } catch(e1){
    try {
      net.module = await import('https://unpkg.com/trystero@0.21.3');
      return net.module;
    } catch(e2){
      throw new Error('Gagal load Trystero: ' + e1.message);
    }
  }
}

async function netCleanup(){
  stopLobbyHeartbeat();
  if (net.room){
    try {
      await Promise.race([
        net.room.leave(),
        new Promise(resolve => setTimeout(resolve, 2000))
      ]);
    } catch(e){}
  }
  net.room = null;
  net.actions = {};
  net.players = {};
  net.connected = false;
  net.mode = 'solo';
  net.connecting = false;
  net.isHost = false;
  net.peerIdToPlayerId = {};
  net.roomCode = '';
  net.status = '';
  net.lastSend = 0;
  // STEP 2/3/4/5: bersihkan state sinkronisasi & timer.
  net.pendingOver = false;
  net.peerSeen = false;
  net.hostTimeLeft = null;
  net.hostTimeAt = 0;
  net.clockOffset = null;
  net._timeAcc = 0;
  net._pingN = 0;
  if (net._overTimer){ try{ clearTimeout(net._overTimer); }catch(e){} net._overTimer = null; }
  if (net._connTimer){ try{ clearInterval(net._connTimer); }catch(e){} net._connTimer = null; }
  // Reset module Trystero biar tidak ada state kotor dari room lama
  // (comment dulu, bisa diaktifkan kalau perlu)
  // net.module = null;
}

function startLobbyHeartbeat(){
  stopLobbyHeartbeat();
  net.heartbeat = setInterval(() => {
    if ((state !== 'waiting' && state !== 'race') || !net.room){ stopLobbyHeartbeat(); return; }
    if (state === 'waiting'){
      if (net.isHost) broadcastRoster();
      else {
        try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: net.isHost}); } catch(e){}
      }
    } else if (state === 'race'){
      // Saat race: semua pemain (host & guest) kirim hello berkala agar nama
      // pulih walau paket hello awal hilang (MQTT QoS 0). Mode solo tidak pakai heartbeat.
      if (net.mode === 'solo'){ stopLobbyHeartbeat(); return; }
      try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: net.isHost}); } catch(e){}
    }
    // STEP 5 (#4): ping clock-sync tiap ~2 dtk (guest saja).
    if (!net.isHost && net.actions.sendPing){
      net._pingN = (net._pingN || 0) + 1;
      if (net._pingN % 4 === 0){ try { net.actions.sendPing({t0: performance.now()}); } catch(e){} }
    }
  }, 500);
}

function stopLobbyHeartbeat(){
  if (net.heartbeat){ clearInterval(net.heartbeat); net.heartbeat = null; }
}

async function createRoom(){
  if (net.connecting) return;
  await netCleanup();
  net.mode = 'host';
  net.isHost = true;
  net.connecting = true;
  net.roomCode = genRoomCode();
  net.status = 'Menyiapkan room...';
  setScene('waiting');

  try {
    const {joinRoom} = await loadTrystero();
    net.room = joinRoom(EMQX_ROOM_CONFIG, net.roomCode);
    setupRoomHandlers();

    net.players[net.myId] = {
      x: W/2, y: START_Y, vx:0, vy:0, score:0, coinCount:0,
      powerTimer:0, alive:true, name: myName, skin: selectedSkin,
      ready:true, isMe:true, isHost:true
    };

    // STEP 6 (#6): hello segera (tanpa tunggu), bukan cuma saat peer join.
    try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: true}); } catch(e){}
    // STEP 3 (#5): host "connected" hanya kalau ada peer/hello nyata,
    // atau setelah 3 dtk (signaling warm-up) — bukan klaim buta 600ms.
    let waited = 0;
    net._connTimer = setInterval(() => {
      waited += 300;
      if (net.peerSeen || waited >= 3000){
        try{ clearInterval(net._connTimer); }catch(e){} net._connTimer = null;
        if (state === 'waiting' && net.isHost){
          net.connected = true;
          net.connecting = false;
          net.status = '';
        }
      }
    }, 300);
  } catch(e){
    net.status = 'Error: ' + e.message;
    net.connecting = false;
    setTimeout(()=>{ netCleanup(); setScene('mpMenu'); }, 3000);
  }
}

async function joinRoomNet(code){
  if (net.connecting) return;
  await netCleanup();
  net.mode = 'client';
  net.isHost = false;
  net.connecting = true;
  net.roomCode = code.toUpperCase();
  net.status = 'Menghubungkan...';
  setScene('waiting');

  try {
    const {joinRoom} = await loadTrystero();
    net.room = joinRoom(EMQX_ROOM_CONFIG, net.roomCode);
    setupRoomHandlers();

    // Room validation timeout
    setTimeout(() => {
      // Cek apakah ada host yang terdeteksi
      const hasHost = Object.keys(net.players).some(
        pid => pid !== net.myId && net.players[pid].isHost
      );
      
      // Kalau tidak ada host DAN masih di scene waiting DAN belum connected
      if (!hasHost && state === 'waiting' && !net.connected) {
        net.status = '❌ Room tidak ditemukan. Pastikan kode benar dan host sudah membuat room.';
        // Tunggu 2 detik supaya user baca pesan, lalu kembali ke menu
        setTimeout(() => {
          netCleanup();
          setScene('mpMenu');
        }, 2000);
      }
    }, 5000);

    net.players[net.myId] = {
      x: W/2, y: START_Y, vx:0, vy:0, score:0, coinCount:0,
      powerTimer:0, alive:true, name: myName, skin: selectedSkin,
      ready:true, isMe:true, isHost:false
    };

    // STEP 6 (#6): hello segera + ulangan 400ms (QoS 0 bisa hilang).
    try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: false}); } catch(e){}
    setTimeout(() => {
      try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: false}); } catch(e){}
    }, 400);
    // STEP 3 (#5): HAPUS fallback buta 6 detik. Validasi nyata hanya via
    // hello/roster (lihat getHello/getRoster) + cek 5 detik di atas.
  } catch(e){
    net.status = 'Error: ' + e.message;
    net.connecting = false;
    setTimeout(()=>{ netCleanup(); setScene('mpMenu'); }, 3000);
  }
}

function setupRoomHandlers(){
  const room = net.room;
  const [sendHello, getHello]       = room.makeAction('hello');
  const [sendState, getState]       = room.makeAction('state');
  const [sendStart, getStart]       = room.makeAction('start');
  const [sendStartAck, getStartAck] = room.makeAction('startAck');
  const [sendOver, getOver]         = room.makeAction('over');
  const [sendRoster, getRoster]     = room.makeAction('roster');
  // STEP 2 (#1): minta state final sebelum ranking. STEP 4 (#3): timeSync.
  // STEP 5 (#4): ping/pong untuk clock sync.
  const [sendFinalReq, getFinalReq] = room.makeAction('requestFinalState');
  const [sendTime, getTime]         = room.makeAction('timeSync');
  const [sendPing, getPing]         = room.makeAction('ping');
  const [sendPong, getPong]         = room.makeAction('pong');
  net.actions = { sendHello, sendState, sendStart, sendStartAck, sendOver,
    sendRoster, sendFinalReq, sendTime, sendPing, sendPong };

  room.onPeerJoin((peerId) => {
    net.peerSeen = true; // STEP 3 (#5): bukti nyata ada peer
    try { sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: net.isHost}, peerId); } catch(e){}
    if (net.isHost){
      setTimeout(() => { try { sendRoster({list: rosterList()}, peerId); } catch(e){} }, 200);
    }
  });

  room.onPeerLeave((peerId) => {
    const pid = net.peerIdToPlayerId[peerId];
    if (pid){
      delete net.players[pid];
      delete net.peerIdToPlayerId[peerId];
    }
    if (net.isHost) setTimeout(() => broadcastRoster(), 100);
  });

  getHello((data, peerId) => {
    net.peerSeen = true; // STEP 3 (#5): bukti nyata ada peer
    net.peerIdToPlayerId[peerId] = data.id;
    const existing = net.players[data.id];
    if (existing){
      // Jangan overwrite nama/skin yang sudah benar dengan nilai kosong.
      if (data.name && String(data.name).trim() !== '') existing.name = data.name;
      if (data.skin && data.skin !== '') existing.skin = data.skin;
      if (typeof data.isHost !== 'undefined') existing.isHost = data.isHost;
    } else {
      net.players[data.id] = {
        x: W/2, y: START_Y, vx:0, vy:0, score:0, coinCount:0,
        powerTimer:0, alive:true, name: data.name, skin: data.skin,
        ready:true, isMe:false, isHost: data.isHost, history: []
      };
    }
    net.connected = true;
    net.connecting = false;
    net.status = '';
    if (net.isHost) setTimeout(() => broadcastRoster(), 100);
  });

  getRoster((data) => {
    if (net.isHost) return;
    if (!data || !Array.isArray(data.list)) return;
    // STEP 3 (#5): roster berisi = bukti nyata room hidup.
    if (data.list.length > 0){
      net.connected = true;
      net.connecting = false;
      net.status = '';
    }
    // MERGE (bukan REPLACE): jangan hapus entri lokal yang belum ada di roster host,
    // supaya entri sendiri tidak terhapus kalau hello kita telat sampai.
    data.list.forEach(p => {
      if (!p || !p.id) return;
      if (p.id === net.myId){
        // Pastikan entri sendiri tetap ada; jangan overwrite nama lokal.
        if (!net.players[net.myId]){
          net.players[net.myId] = {
            x:W/2, y:START_Y, vx:0, vy:0, score:0, coinCount:0,
            powerTimer:0, alive:true, name: myName, skin: selectedSkin,
            ready:true, isMe:true, isHost:false, history: []
          };
        } else {
          net.players[net.myId].isMe = true;
        }
        return;
      }
      const ex = net.players[p.id];
      if (ex){
        // Update identitas saja, jangan sentuh posisi/skor (getState yang menang).
        // Jangan overwrite nama yang sudah benar dengan nilai kosong.
        if (p.name && String(p.name).trim() !== '') ex.name = p.name;
        if (p.skin && p.skin !== '') ex.skin = p.skin;
        if (typeof p.isHost !== 'undefined') ex.isHost = p.isHost;
        ex.isMe = false;
      } else {
        net.players[p.id] = {
          x:W/2, y:START_Y, vx:0, vy:0, score:0, coinCount:0,
          powerTimer:0, alive:true,
          name: (p.name && String(p.name).trim() !== '') ? p.name : 'Pemain',
          skin: p.skin || 'classic',
          ready:true, isMe:false, isHost: !!p.isHost, history: []
        };
      }
    });
  });

  getState((data) => {
    if (data.id === net.myId) return;
    // FIX guest stuck: kalau guest masih di lobby tapi host sudah main (state alive),
    // paksa masuk race agar tidak stuck di "Menunggu host memulai..." selamanya.
    if (!net.isHost && state === 'waiting' && data.alive) {
      if (raceState.phase !== 'playing') {
        raceState.phase = 'playing';
        raceState.timeLeft = RACE_TIME;
        state = 'race';
        startLobbyHeartbeat();
      }
    }
    let p = net.players[data.id];
    if (!p){
      p = {
        id: data.id,
        x: data.x || 0, y: data.y || 0, vx: data.vx || 0, vy: data.vy || 0,
        score: data.score || 0, coinCount: data.coinCount || 0,
        powerTimer: 0, alive: true,
        name: 'Pemain', skin: 'classic',
        isMe: false, isHost: false,
        history: []
      };
      net.players[data.id] = p;
    }
    if (p && !p.isMe){
      p.x = data.x;
      p.y = data.y;
      p.vx = data.vx;
      p.vy = data.vy;
      p.score = data.score;
      p.coinCount = data.coinCount;
      p.powerTimer = data.powerTimer;
      p.alive = data.alive;
      if (data.name && String(data.name).trim() !== '') {
        p.name = data.name;
      }
      if (data.skin && data.skin !== '') {
        p.skin = data.skin;
      }
      if (!Array.isArray(p.history)) p.history = [];
      p.history.push({t: performance.now(), x: data.x, y: data.y});
      if (p.history.length > 4) p.history.shift();
    }
  });

  getStart((data) => {
    if (net.isHost) return;
    // Izinkan race ke-2: guest di lobby 'waiting' boleh terima start walau phase masih 'ended' dari race sebelumnya.
    if (raceState.phase !== 'idle' && state !== 'waiting') return;
    if (!data || typeof data.seed === 'undefined') return;
    setSeed(data.seed);
    // STEP 5 (#4): pakai jam host + offset; fallback jam lokal.
    raceState.startAt = (typeof data.startAtHost === 'number')
      ? data.startAtHost + (net.clockOffset || 0)
      : performance.now() + data.delay;
    startRace(true);
    try { net.actions.sendStartAck({id: net.myId}); } catch(e){}
  });

  getStartAck((data) => {
    if (!net.isHost) return;
    net._startAckCount = (net._startAckCount || 0) + 1;
  });

  getOver((data) => {
    if (net.isHost) return;
    raceState.phase = 'ended';
    showResult(data.ranking);
  });

  // STEP 2 (#1): guest kirim state final saat diminta host.
  getFinalReq(() => {
    if (net.isHost) return;
    if (state !== 'race') return;
    try { broadcastState(); } catch(e){}
  });

  // STEP 4 (#3): guest simpan timeLeft otoritatif host + waktu terima.
  getTime((data) => {
    if (net.isHost) return;
    if (!data || typeof data.t !== 'number') return;
    net.hostTimeLeft = data.t;
    net.hostTimeAt = performance.now();
  });

  // STEP 5 (#4): host balas ping dengan timestamp host.
  getPing((data) => {
    if (!net.isHost) return;
    if (!data || typeof data.t0 !== 'number') return;
    try { net.actions.sendPong({t0: data.t0, t1: performance.now()}); } catch(e){}
  });

  // STEP 5 (#4): guest hitung clock offset (rata-rata bergerak).
  getPong((data) => {
    if (net.isHost) return;
    if (!data || typeof data.t0 !== 'number' || typeof data.t1 !== 'number') return;
    const now = performance.now();
    const off = data.t1 - (data.t0 + (now - data.t0)/2);
    net.clockOffset = (net.clockOffset == null) ? off : net.clockOffset*0.7 + off*0.3;
  });
}

function tone(f,d,t,v,f2){
  if(!settings.sfx) return;
  const ac = AC(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t||'sine';
  o.frequency.setValueAtTime(f, ac.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime+d);
  g.gain.setValueAtTime(v||0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+d+0.02);
}

function playNote(f,time,dur,type,vol){
  const ac = AC(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, time);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(time); o.stop(time+dur+0.03);
}
function musicTick(){
  if(!settings.music) return;
  const ac = AC(); if(!ac || ac.state==='suspended') return;
  while (music.nextTime < ac.currentTime + 0.25){

    playNote(music.MEL[s], music.nextTime, 0.20, 'triangle', 0.022);
    playNote(music.BAS[s], music.nextTime, 0.24, 'sawtooth', 0.026);
    if(s%4===0) playNote(90, music.nextTime, 0.09, 'sine', 0.045);
    music.step++; music.nextTime += 0.22;
  }
}

function spawnPlatform(y){

  const w = 84 - diff*24;
  const x = rngRange(10, W-w-10);
  let type = 'normal';
  const r = rng();
  if (r < 0.12 + diff*0.16) type = 'moving';
  else if (r < 0.19 + diff*0.16) type = 'spring';
  const p = { x, y, w, h:14, type,
    vx: type === 'moving' ? (rng()<0.5?-1:1)*rngRange(55,115) : 0 };
  platforms.push(p);

    coins.push({
      x: x+w/2, y: y-40, taken:false,
      phase: rng()*6.283,

}

function burst(x,y,color,n,spread){
  spread = spread||300;
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, sp = rand(50,spread);
    particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80,
      life:rand(0.35,0.85), max:0.85, color, size:rand(2,5.5) });
  }
}

function doJump(){
  if (state !== 'race' || raceState.phase !== 'playing' || raceState.localDead) return;
  if (paused && net.mode === 'solo') return;
  if (airJumpsLeft > 0){
    airJumpsLeft--;
    player.vy = DOUBLE_JUMP_V;
    player.sq = 0.78;
    sfxDJ(); haptic(15);
    burst(player.x, player.y + player.h/2, '#b3ecff', 10, 180);
  }
}

function updateGame(dt){
  if (paused && net.mode === 'solo') return;
  for (const p of particles){
    p.life -= dt; p.vy += 950*dt; p.vx *= (1-1.6*dt);
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  if (particles.length > 400) particles.splice(0, particles.length-400);
  particles = particles.filter(p => p.life > 0);

  if (flash > 0) flash = Math.max(0, flash - dt*2.6);
  if (shake > 0) shake = Math.max(0, shake - dt*45);
  if (powerTextTimer > 0) powerTextTimer = Math.max(0, powerTextTimer - dt);
  if (tapTimer > 0){ tapTimer -= dt; if(tapTimer<=0) tapSide=0; }

  if (state !== 'race') return;
  if (raceState.phase !== 'playing') return;
  if (raceState.localDead) return;

  if (powerTimer > 0) powerTimer = Math.max(0, powerTimer - dt);
  const powered = powerTimer > 0;

  let dir = 0;
  if (keys.left)  dir -= 1;
  if (keys.right) dir += 1;
  if (touchDir !== 0) dir = touchDir;
  if (drag.active){
    const d = drag.x - player.x;
    if (Math.abs(d) > 7) dir = Math.sign(d);
    else dir = 0;
  }
  if (dir === 0 && tapSide !== 0) dir = tapSide;

  player.vx = dir * MOVE_SPEED;
  player.x += player.vx * dt;

  const hw = player.w/2;
  if (player.x < -hw) player.x = W + hw;
  if (player.x > W + hw) player.x = -hw;

  const prevY = player.y;
  player.vy += GRAV*dt;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  player.y += player.vy*dt;
  player.sq += (1 - player.sq) * Math.min(1, dt*13);

  if (player.vy > 0){
    const prevB = prevY + player.h/2;
    const curB  = player.y + player.h/2;
    let hit = null;
    for (const p of platforms){
      if (curB >= p.y && prevB <= p.y+4){
        if (player.x + hw*0.72 > p.x && player.x - hw*0.72 < p.x + p.w){
          if (!hit || p.y < hit.y) hit = p;
        }
      }
    }
    if (hit){
      let mult = 1;
      if (hit.type === 'spring'){ mult = 1.62; sfxSpring(); haptic(20); }
      else { sfxBounce(); haptic(12); }
      if (powered) mult = Math.max(mult, POWER_JUMP);
      player.vy = JUMP_V*mult;
      player.y  = hit.y - player.h/2;
      player.sq = 0.72;
      airJumpsLeft = 1;
      const col = hit.type === 'spring' ? '#7dffb0' : hit.type === 'moving' ? '#8fd0ff' : '#ffd98a';
      burst(player.x, hit.y, col, 7, 180);
    }
  }

  for (const p of platforms){
    if (p.type !== 'moving') continue;
    p.x += p.vx*dt;
    if (p.x < 6){ p.x = 6; p.vx *= -1; }
    if (p.x + p.w > W-6){ p.x = W-6-p.w; p.vx *= -1; }
  }

  if (powered){
    for (const c of coins){
      if (c.taken) continue;
      const dx = player.x-c.x, dy = player.y-c.y;
      const d = Math.hypot(dx,dy)||1;
      if (d < 230){ const pull = 1100*dt; c.x += dx/d*pull; c.y += dy/d*pull; }
    }
  }

  for (const c of coins){
    if (c.taken) continue;
    const dx = c.x-player.x, dy = c.y-player.y;
    if (dx*dx + dy*dy < 38*38){
      c.taken = true; coinCount++; coinsTotal++; score += 5;
      const palette = JELLY_COLORS[c.colorIdx || 0];
      burst(c.x, c.y, palette.mid, 11, 260);
      sfxCoin(); haptic(8);
      if (coinCount >= COINS_NEEDED){
        coinCount = 0; powerTimer = POWER_DURATION;
        powerTextTimer = POWER_TEXT_DUR; flash = 1; shake = 8;
        burst(player.x, player.y, '#ffe680', 34, 420);
        burst(player.x, player.y, '#fff6b0', 22, 300);
        sfxPower(); haptic([30,40,30,40,60]);
      }
    }
  }

  const targetCam = player.y - H*0.45;
  if (targetCam < camY) camY += (targetCam-camY)*Math.min(1, dt*11);

  while (topY > camY - 400){
    const diff = clamp(-topY/7000, 0, 1);
    topY -= rngRange(80, 128 + diff*22);
    spawnPlatform(topY);
  }
  platforms = platforms.filter(p => p.y < camY+H+180);
  coins     = coins.filter(c => !c.taken && c.y < camY+H+180);

  if (player.y < maxReach) maxReach = player.y;
  score = Math.max(0, Math.floor((START_Y - maxReach)/10)) + coinsTotal*5;

  if (player.y - camY > H + 70){
    onPlayerDied();
  }
}

function onPlayerDied(){
  if (net.mode === 'solo'){
    state = 'gameover';
    overT = 0;
    sfxOver();
    if (score > best){
      best = score;
      try{ localStorage.setItem('blobby_best', String(best)); }catch(e){}
    }
    raceState.lastEarnedCoins = coinsTotal;
    totalCoins += coinsTotal;
    saveSkins();
    stopMusic();
  } else {
    raceState.localDead = true;
    sfxOver();
    if (net.isHost){
      const myP = net.players[net.myId];
      if (myP) myP.alive = false;
      checkHostEndCondition();
    }
  }
}

function checkHostEndCondition(){
  let aliveCount = 0;
  Object.keys(net.players).forEach(pid => {
    if (net.players[pid].alive) aliveCount++;
  });
  if (aliveCount <= 1){
    endRaceHost();
  }
}

// STEP 2 (#1): grace period 500ms — minta state final semua guest dulu
// supaya lompatan/koin detik terakhir ikut kehitung di ranking.
function endRaceHost(){
  if (raceState.phase === 'ended' || net.pendingOver) return;
  net.pendingOver = true;
  try { net.actions.sendFinalReq({}); } catch(e){}
  net._overTimer = setTimeout(() => {
    net.pendingOver = false;
    if (raceState.phase === 'ended') return;
    raceState.phase = 'ended';
    stopMusic();

    const arr = Object.keys(net.players).map(pid => ({
      id: pid, name: net.players[pid].name, skin: net.players[pid].skin,
      score: net.players[pid].score, alive: net.players[pid].alive
    }));
    arr.sort((a,b) => {
      if (a.alive !== b.alive) return b.alive - a.alive;
      return b.score - a.score;
    });

    const ranking = arr.map((p,i) => {
      let bonus = 0;
      if (p.alive) bonus += BONUS_LAST_STANDING;
      if (i === 0) bonus += BONUS_WINNER;
      return { ...p, rank: i+1, bonus };
    });

    try { net.actions.sendOver({ranking}); } catch(e){}
    showResult(ranking);
  }, 500);
}

function showResult(ranking){
  raceState.finalRanking = ranking;
  raceState.phase = 'ended';
  state = 'result';
  overT = 0;
  stopMusic();

  const myEntry = ranking.find(p => p.id === net.myId);
  const myCoins = coinsTotal;
  const myBonus = myEntry ? (myEntry.bonus || 0) : 0;
  raceState.lastEarnedCoins = myCoins;
  raceState.myBonus = myBonus;
  totalCoins += myCoins + myBonus;
  saveSkins();

  if (myEntry && myEntry.rank === 1){
    sfxWin();
    haptic([30, 50, 30, 50, 100]);
  } else {
    sfxLose();
  }
}

/* ============================================================
   SKY SYSTEM "Journey to Space" — STEP A2: gradient dinamis
   Ketinggian h = -camY (0 di tanah, membesar ke atas).
   Keyframe warna satu keluarga Midnight (ink/amber/mint),
   interpolasi linear antar keyframe supaya transisi halus.
   ============================================================ */
/* B1.3 revisi (Hallmark): timeline diperlambat — terang hingga 1000,
   senja 1000-2000, gelap 2000-3000, hitam 3000-4000, space 4000+. */
const SKY_KEYS = [
  { h:0,    label:'ground', star:0,    top:[80,135,215],  mid:[120,170,230], bot:[180,205,240] },
  { h:1000, label:'low',    star:0,    top:[85,130,210],  mid:[125,160,225], bot:[200,190,200] },
  { h:1500, label:'dusk',   star:0.08, top:[70,70,150],   mid:[150,110,170], bot:[235,160,130] },
  { h:2000, label:'high',   star:0.25, top:[40,40,110],   mid:[90,70,150],   bot:[170,110,150] },
  { h:3000, label:'edge',   star:0.7,  top:[14,16,44],    mid:[30,28,72],    bot:[70,55,100] },
  { h:4000, label:'space',  star:1,    top:[4,5,14],      mid:[8,9,24],      bot:[18,16,40] }
];
// Interpolasi satu channel warna
function lerp3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgbStr(c){ return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'; }
// Ketinggian -> warna langit + opacity bintang + label layer
function getSkyLayer(h){
  h = Math.max(0, h || 0);
  let i = 0;
  while (i < SKY_KEYS.length-2 && h >= SKY_KEYS[i+1].h) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i+1];
  const f = clamp((h-a.h)/Math.max(1,b.h-a.h), 0, 1);
  return {
    top: lerp3(a.top, b.top, f),
    mid: lerp3(a.mid, b.mid, f),
    bot: lerp3(a.bot, b.bot, f),
    starOpacity: a.star+(b.star-a.star)*f,
    label: f < 0.5 ? a.label : b.label
  };
}

/* ============================================================
   SKY SYSTEM — STEP A3: bintang (cache sekali, parallax, twinkle)
   Warna bintang satu keluarga brand: ink-putih, amber, biru muda.
   ============================================================ */
const STAR_COLORS = ['255,247,224', '255,226,122', '170,200,255'];
let starCache = null;
// Generate 180 bintang deterministik (hash, bukan Math.random)
function getStars(){
  if (starCache) return starCache;
  starCache = [];
  for (let i=0;i<180;i++){
    const r1=hash(i*3.7+1), r2=hash(i*7.3+2), r3=hash(i*13.1+3), r4=hash(i*17.7+4), r5=hash(i*23.3+5);
    starCache.push({
      x: r1, y: r2,
      par: 0.1 + r3*0.25, // makin jauh, makin lambat gerak
      size: 0.6 + r4*1.6,
      ci: Math.floor(r5*3) % 3,
      ph: r1*6.283, sp: 0.6 + r2*1.8
    });
  }
  return starCache;
}
// Render bintang dengan twinkle halus (sin wave)
function drawStars(opacity){
  if (opacity <= 0.01) return;
  const now = performance.now()*0.001;
  const bandH = H + 200;
  const stars = getStars();
  ctx.save();
  for (const s of stars){
    const tw = 0.55 + 0.45*Math.sin(now*s.sp + s.ph);
    const a = opacity * tw;
    if (a <= 0.02) continue;
    let y = (s.y*bandH - camY*s.par) % bandH;
    if (y < 0) y += bandH;
    y -= 100;
    if (y < -10 || y > H+10) continue;
    ctx.globalAlpha = Math.min(1, a);
    ctx.fillStyle = 'rgba(' + STAR_COLORS[s.ci] + ',1)';
    ctx.beginPath(); ctx.arc(s.x*W, y, s.size, 0, 6.283); ctx.fill();
    // Kilau silang untuk bintang besar saat di space
    if (s.size > 1.6 && opacity > 0.5){
      ctx.globalAlpha = a*0.35;
      ctx.fillRect(s.x*W - s.size*2.2, y - 0.5, s.size*4.4, 1);
      ctx.fillRect(s.x*W - 0.5, y - s.size*2.2, 1, s.size*4.4);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

   ============================================================ */
/* B1.3 (Hallmark+Impeccable): urutan sesuai jarak dari Bumi, tiap

   dalam satu keluarga Midnight. Glow TIDAK diubah di sini (B1.6). */
/* B1.3 revisi: tiap planet punya SEGMEN sendiri + jeda 200 antar
   planet (tidak tumpang tindih). Tiap segmen 800: terbit 200,
   penuh 400, terbenam 200. */
const PLANETS = [
  { name:'Venus',   color:'#D9B36A', dark:'#8A6530', light:'#F5E2B0',
    visibleFrom:4000, visibleTo:4800, size:12, xRatio:0.7,  yRatio:0.3, glow:false, swirls:true },
  { name:'Mars',    color:'#C1440E', dark:'#7A2A0A', light:'#E8804F',
    visibleFrom:5000, visibleTo:5800, size:10, xRatio:0.15, yRatio:0.28, glow:false },
  { name:'Jupiter', color:'#D4A574', dark:'#8A6238', light:'#F0D0A0',
    visibleFrom:6000, visibleTo:6800, size:18, xRatio:0.78, yRatio:0.34, bands:true, glow:true },
  { name:'Saturn',  color:'#E8D4A0', dark:'#9A7F4E', light:'#FFF2CC',
    visibleFrom:7000, visibleTo:7800, size:20, xRatio:0.35, yRatio:0.22, hasRing:true, glow:true }
];
const PLANET_RISE = 200, PLANET_SET = 200; // panjang fase terbit/terbenam
// Easing halus untuk gerak terbit/terbenam (Impeccable)
function easeInOutQuad(t){ t = clamp(t,0,1); return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
// State machine per planet: waiting|rising|active|setting|done
function getPlanetState(p, h){
  if (h < p.visibleFrom) return 'waiting';
  if (h < p.visibleFrom+PLANET_RISE) return 'rising';
  if (h <= p.visibleTo-PLANET_SET) return 'active';
  if (h <= p.visibleTo) return 'setting';
  return 'done';
}
// Lingkaran planet dengan shading + glow halus
function drawPlanetBody(px, py, r, p){
  ctx.save();
  ctx.translate(px, py);
  // B1.6 (Impeccable/restraint): glow planet max 5px — definisi
  // bentuk dari shading radial, bukan dari halo. Jelly tak tersentuh.
  if (p.glow){ ctx.shadowColor = p.color; ctx.shadowBlur = 5; }
  else { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4; }
  const g = ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.1, 0,0,r*1.15);
  g.addColorStop(0, p.light);
  g.addColorStop(0.55, p.color);
  g.addColorStop(1, p.dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}
// Render planet dalam zonanya: terbit dari bawah horizon (fade-in),
// posisi normal di tengah zona, terbenam turun ke bawah (fade-out)
function drawPlanets(h){
  h = Math.max(0, h || 0);
  for (const p of PLANETS){
    const st = getPlanetState(p, h);
    if (st === 'waiting' || st === 'done') continue;
    // rising: fade-in + naik dari bawah (ease-out); setting: sebaliknya
    let a, yOff;
    if (st === 'rising'){
      const f = easeInOutQuad((h-p.visibleFrom)/PLANET_RISE);
      a = f; yOff = (1-f)*(H+60 - p.yRatio*H);
    } else if (st === 'setting'){
      const f = easeInOutQuad((p.visibleTo-h)/PLANET_SET);
      a = f; yOff = (1-f)*(H+60 - p.yRatio*H);
    } else { a = 1; yOff = 0; }
    if (a <= 0.01) continue;
    const px = p.xRatio*W, py = p.yRatio*H + yOff, r = p.size;
    ctx.save();
    ctx.globalAlpha = a;
    // Ring Saturnus: separuh belakang dulu, separuh depan setelah badan
    if (p.hasRing){
      ctx.save();
      ctx.translate(px, py); ctx.rotate(-0.35);
      ctx.globalAlpha = a*0.5;
      ctx.strokeStyle = p.light; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, r*1.9, r*0.55, 0, Math.PI, 2*Math.PI); ctx.stroke();
      ctx.restore();
    }
    drawPlanetBody(px, py, r, p);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, py);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip();
    if (p.bands){
      // Pita horizontal Jupiter
      ctx.fillStyle = 'rgba(255,242,220,0.5)';
      ctx.fillRect(-r, -r*0.45, r*2, r*0.22);
      ctx.fillRect(-r, r*0.15, r*2, r*0.18);
      ctx.fillStyle = 'rgba(90,60,30,0.35)';
      ctx.fillRect(-r, -r*0.1, r*2, r*0.2);
    } else if (p.swirls){
      // Pusaran lembut Venus
      ctx.strokeStyle = 'rgba(245,226,176,0.55)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-r*0.1, -r*0.1, r*0.5, 0.3, 2.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(r*0.15, r*0.2, r*0.35, 2.8, 5.2); ctx.stroke();
    } else if (!p.hasRing){
      // Kawah Mars: beberapa titik gelap
      ctx.fillStyle = 'rgba(90,30,10,0.4)';
      ctx.beginPath(); ctx.arc(-r*0.3, -r*0.1, r*0.18, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.25, r*0.3, r*0.13, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.1, -r*0.45, r*0.1, 0, 6.283); ctx.fill();
    }
    ctx.restore();
    if (p.hasRing){
      // Separuh depan ring menutup badan planet
      ctx.save();
      ctx.globalAlpha = a*0.9;
      ctx.translate(px, py); ctx.rotate(-0.35);
      ctx.strokeStyle = p.light; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, r*1.9, r*0.55, 0, 0, Math.PI); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   SKY SYSTEM — STEP B1.4: galaksi (zona h 6500-8200)
   Impeccable: Milky Way berlapis + noise deterministik (bukan
   satu gradient malas), Andromeda punya kedalaman, bintang
   galaksi ikut twinkle halus.
   ============================================================ */
/* B1.4 revisi: galaksi penuh 8000-9000, terbenam 9000-10000. */
const GALAXY_FROM = 8000, GALAXY_TO = 10000, GALAXY_FADE = 500;
/* B1.4: nebula redup di belakang planet — samar sejak 4000-an,
   makin jelas tiap segmen, ikut terbenam bersama galaksi. */
function nebulaAlpha(h){
  if (h < 4000 || h > 10000) return 0;
  return Math.min(clamp((h-4000)/4000,0,1)*0.5+0.08,
                  clamp((10000-h)/500,0,1));
}
function drawNebulaBack(h){
  const a = nebulaAlpha(h);
  if (a <= 0.01) return;
  const blobs = [
    { x:0.2, y:0.3, r:150, c:'150,110,200' },
    { x:0.8, y:0.55, r:180, c:'90,160,180' },
    { x:0.5, y:0.8, r:140, c:'200,120,150' }
  ];
  ctx.save();
  for (const b of blobs){
    const g = ctx.createRadialGradient(b.x*W,b.y*H,0, b.x*W,b.y*H,b.r);
    g.addColorStop(0, 'rgba(' + b.c + ',' + (0.20*a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + b.c + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}
/* B1.4: Bumi + aurora di horizon (zona 3300-4100, puncak 3500-4000). */
const EARTH_FROM = 3300, EARTH_TO = 4100, EARTH_FADE = 400;
function drawEarth(h){
  if (h < EARTH_FROM || h > EARTH_TO) return;
  const a = Math.min(clamp((h-EARTH_FROM)/EARTH_FADE,0,1),
                     clamp((EARTH_TO-h)/EARTH_FADE,0,1));
  if (a <= 0.01) return;
  const R = 520, cx = W/2, cy = H + R - 90;
  ctx.save();
  ctx.globalAlpha = a;
  // Pendar atmosfer di bibir horizon
  ctx.strokeStyle = 'rgba(120,220,200,0.5)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  // Samudra + daratan (terpotong lingkaran Bumi)
  const g = ctx.createRadialGradient(cx-120, cy-R-40, 30, cx, cy, R);
  g.addColorStop(0, 'rgba(70,170,200,0.95)');
  g.addColorStop(1, 'rgba(20,60,120,0.95)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.clip();
  ctx.fillStyle = 'rgba(90,180,120,0.9)';
  ctx.beginPath(); ctx.ellipse(cx-90, cy-R+55, 70, 22, 0.2, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+110, cy-R+80, 55, 18, -0.2, 0, 6.283); ctx.fill();
  ctx.restore();
  // Aurora: 2 pita bergelombang di atas horizon (bergerak pelan)
  ctx.save();
  ctx.globalAlpha = a*0.35;
  const now = performance.now()*0.0006;
  for (let k=0;k<2;k++){
    ctx.strokeStyle = k ? 'rgba(120,255,190,0.8)' : 'rgba(150,220,255,0.7)';
    ctx.lineWidth = 10 - k*4; ctx.lineCap = 'round';
    ctx.beginPath();
    const baseY = H - 130 - k*36;
    for (let x=0;x<=W;x+=16){
      const y = baseY + Math.sin(x*0.03 + now + k*2)*14 - (x/W)*20;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
// Bintang galaksi: cache sekali, posisi menempel pita Milky Way
let galaxyStarCache = null;
function getGalaxyStars(){
  if (galaxyStarCache) return galaxyStarCache;
  galaxyStarCache = [];
  for (let i=0;i<70;i++){
    galaxyStarCache.push({
      along: hash(i*5.1+11)-0.5,   // posisi sepanjang pita (-0.5..0.5)
      across: (hash(i*9.7+23)-0.5)*2, // sebaran tegak lurus pita
      size: 0.5 + hash(i*3.3+7)*1.3,
      amber: hash(i*7.9+3) > 0.7,  // sedikit bintang amber brand
      ph: hash(i*11.3+5)*6.283, sp: 0.8 + hash(i*4.9+13)*1.6
    });
  }
  return galaxyStarCache;
}
// Pita Milky Way diagonal: 3 lapis cahaya + 1 jalur debu gelap + noise
function drawMilkyWay(a){
  ctx.save();
  ctx.translate(W*0.5, H*0.45);
  ctx.rotate(-0.5);
  // Lapis cahaya: lebar & redup -> sempit & terang (kedalaman)
  ctx.fillStyle = 'rgba(190,198,232,' + (0.10*a).toFixed(3) + ')';
  ctx.fillRect(-W, -70, W*2, 140);
  ctx.fillStyle = 'rgba(205,210,240,' + (0.13*a).toFixed(3) + ')';
  ctx.fillRect(-W, -40, W*2, 80);
  ctx.fillStyle = 'rgba(225,228,250,' + (0.15*a).toFixed(3) + ')';
  ctx.fillRect(-W, -18, W*2, 36);
  // Jalur debu gelap di tengah (ciri khas Milky Way)
  ctx.fillStyle = 'rgba(6,7,18,' + (0.28*a).toFixed(3) + ')';
  ctx.fillRect(-W, -4, W*2, 9);
  // Noise: titik-titik gugus bintang sepanjang pita
  for (let i=0;i<46;i++){
    const nx = (hash(i*13.7+41)-0.5)*W*1.8;
    const ny = (hash(i*7.1+17)-0.5)*120;
    ctx.fillStyle = hash(i*3.9+29) > 0.75
      ? 'rgba(255,226,122,' + (0.5*a).toFixed(3) + ')'
      : 'rgba(225,228,250,' + (0.4*a).toFixed(3) + ')';
    const nr = 0.5 + hash(i*6.3+53)*1.4;
    ctx.beginPath(); ctx.arc(nx, ny, nr, 0, 6.283); ctx.fill();
  }
  // Bintang galaksi yang twinkle
  const now = performance.now()*0.001;
  for (const s of getGalaxyStars()){
    const tw = 0.5 + 0.5*Math.sin(now*s.sp + s.ph);
    ctx.fillStyle = s.amber
      ? 'rgba(255,226,122,' + (a*tw).toFixed(3) + ')'
      : 'rgba(235,238,255,' + (a*tw).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(s.along*W*1.7, s.across*55, s.size, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
// Andromeda: nebula ellipse berlapis (luar redup -> inti terang)
function drawAndromeda(a){
  const px = W*0.72, py = H*0.62;
  ctx.save();
  ctx.translate(px, py); ctx.rotate(-0.4);
  ctx.fillStyle = 'rgba(170,180,225,' + (0.10*a).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(0, 0, 52, 20, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(195,200,238,' + (0.16*a).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 12, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(240,242,255,' + (0.30*a).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 5, 0, 0, 6.283); ctx.fill();
  ctx.restore();
}
function drawGalaxies(h){
  h = Math.max(0, h || 0);
  if (h < GALAXY_FROM || h > GALAXY_TO) return;
  const a = Math.min(clamp((h-GALAXY_FROM)/GALAXY_FADE,0,1),
                     clamp((GALAXY_TO-h)/GALAXY_FADE,0,1));
  if (a <= 0.01) return;
  drawMilkyWay(a);
  drawAndromeda(a);
}

/* ============================================================
   SKY SYSTEM — STEP B1.5: black hole (h >= 8000, objek terakhir)
   Impeccable+Halmark: accretion disk gradient amber->coral dari
   palette terkunci, photon ring tipis, distorsi hanya lengkung
   bintang samar — subtle, tidak norak.
   ============================================================ */
/* B1.5 revisi (timeline lambat): black hole objek terakhir di 10000+. */
const BLACK_HOLE_FROM = 10000, BLACK_HOLE_FADE = 600;
function drawBlackHole(h){
  h = Math.max(0, h || 0);
  if (h < BLACK_HOLE_FROM) return;
  const a = clamp((h-BLACK_HOLE_FROM)/BLACK_HOLE_FADE, 0, 1);
  if (a <= 0.01) return;
  const px = W*0.5, py = H*0.38, rHole = 22, rDisk = 46;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(px, py); ctx.rotate(-0.3);
  // Distorsi: lengkung cahaya bintang di sekitar lubang (samar)
  ctx.strokeStyle = 'rgba(200,205,235,0.18)'; ctx.lineWidth = 1.2;
  for (let k=0;k<3;k++){
    const rr = rDisk + 10 + k*9;
    ctx.beginPath(); ctx.ellipse(0, 0, rr, rr*0.42, 0, 0.4, 2.4); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, rr, rr*0.42, 0, Math.PI+0.4, Math.PI+2.4); ctx.stroke();
  }
  // Accretion disk: cincin dengan gradient amber->coral (evenodd)
  const dg = ctx.createLinearGradient(-rDisk, 0, rDisk, 0);
  dg.addColorStop(0, 'rgba(255,208,46,0.95)');
  dg.addColorStop(0.55, 'rgba(255,150,60,0.85)');
  dg.addColorStop(1, 'rgba(255,107,107,0.95)');
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.ellipse(0, 0, rDisk, rDisk*0.38, 0, 0, 6.283);
  ctx.ellipse(0, 0, rHole+4, (rHole+4)*0.38, 0, 0, 6.283);
  ctx.fill('evenodd');
  // Sisi bawah disk lebih terang (lensing depan lubang)
  ctx.fillStyle = 'rgba(255,240,200,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 0, rDisk, rDisk*0.38, 0, 0.15*Math.PI, 0.85*Math.PI);
  ctx.ellipse(0, 0, rHole+4, (rHole+4)*0.38, 0, 0.85*Math.PI, 0.15*Math.PI, true);
  ctx.fill('evenodd');
  ctx.restore();
  // Bola hitam + photon ring (shimmer sangat halus)
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(px, py, rHole, 0, 6.283); ctx.fill();
  const shimmer = 0.5 + 0.12*Math.sin(performance.now()*0.002);
  ctx.globalAlpha = a*shimmer;
  ctx.strokeStyle = 'rgba(255,226,122,0.9)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(px, py, rHole+1.5, 0, 6.283); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ============================================================
   SKY SYSTEM — STEP A5: event langit (lalu lintas atmosfer)
   State di global terpisah (BUKAN net.*) agar networking steril.
   Pakai Math.random (BUKAN rng()) supaya tidak menggeser
   sequence platform yang memakai seeded RNG.
   ============================================================ */
// B1.3 revisi: rentang event ikut timeline baru (atmosfer melambat).
const SKY_EVENT_DEFS = [
  { minH:0,    maxH:500,   type:'paraglider', speed:2,  yOffset:0.3, chance:0.01,  size:0.5 },
  { minH:0,    maxH:600,   type:'bird',       speed:4,  yOffset:0.25, chance:0.012, size:0.5 },
  { minH:500,  maxH:1500,  type:'plane',      speed:6,  yOffset:0.4, chance:0.006, size:0.8 },
  { minH:1000, maxH:1800,  type:'balloon',    speed:1.5,yOffset:0.3, chance:0.005, size:0.6 },
  { minH:2500, maxH:99999, type:'meteor',     speed:15, yOffset:0.5, chance:0.02,  size:0.4 },
  { minH:3000, maxH:99999, type:'satellite',  speed:10, yOffset:0.2, chance:0.01,  size:0.5 },
  { minH:3200, maxH:99999, type:'debris',     speed:8,  yOffset:0.6, chance:0.015, size:0.3 }
];
const MAX_SKY_EVENTS = 3;   // batas anti-spam
const SKY_EVENT_COOLDOWN = 5; // detik antar spawn per tipe
let skyEventList = [];
let skyEventCooldown = {};
// Spawn satu event dari tepi layar acak (kiri/kanan)
function spawnSkyEvent(def){
  const fromLeft = Math.random() < 0.5;
  const dir = fromLeft ? 1 : -1;
  const ev = {
    type: def.type,
    x: fromLeft ? -70 : W+70,
    y: def.yOffset*H + (Math.random()-0.5)*90,
    vx: dir * def.speed * 22, // px/detik
    vy: 0,
    size: def.size,
    seed: Math.random()*6.283
  };
  if (def.type === 'meteor'){
    // Meteor melesat diagonal dari atas
    ev.x = Math.random()*W;
    ev.y = -30;
    ev.vx = (Math.random() < 0.5 ? 1 : -1) * def.speed * 22;
    ev.vy = def.speed * 16;
  }
  skyEventList.push(ev);
  skyEventCooldown[def.type] = SKY_EVENT_COOLDOWN;
}
// Gerakkan event, spawn baru via dice-roll, buang yang keluar layar
function updateSkyEvents(dt){
  const h = Math.max(0, -camY);
  for (const k in skyEventCooldown){
    skyEventCooldown[k] = Math.max(0, skyEventCooldown[k]-dt);
  }
  if (skyEventList.length < MAX_SKY_EVENTS){
    for (const def of SKY_EVENT_DEFS){
      if (h < def.minH || h > def.maxH) continue;
      if ((skyEventCooldown[def.type]||0) > 0) continue;
      if (Math.random() < def.chance*dt*60){
        spawnSkyEvent(def);
        break; // satu spawn per frame cukup
      }
    }
  }
  for (const ev of skyEventList){
    ev.x += ev.vx*dt;
    ev.y += ev.vy*dt;
  }
  skyEventList = skyEventList.filter(ev =>
    ev.x > -110 && ev.x < W+110 && ev.y < H+110);
}
function drawSkyEvent(ev){
  const s = ev.size;
  ctx.save();
  ctx.translate(ev.x, ev.y);
  if (ev.type === 'paraglider'){
    // Kanopi + tali + orang stick
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.ellipse(0, 0, 16*s, 7*s, 0, Math.PI, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(20,20,35,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-13*s, 2); ctx.lineTo(-3*s, 14*s);
    ctx.moveTo(13*s, 2); ctx.lineTo(3*s, 14*s);
    ctx.stroke();
    ctx.fillStyle = '#10142A';
    ctx.beginPath(); ctx.arc(0, 16*s, 2.5*s, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 18*s); ctx.lineTo(0, 24*s); ctx.stroke();
  } else if (ev.type === 'bird'){
    // Burung: siluet dua sayap mengepak (sinus)
    const flap = Math.sin(performance.now()*0.012 + ev.seed)*5*s;
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = '#1A2038'; ctx.lineWidth = 2*s; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9*s, 0); ctx.quadraticCurveTo(-4*s, -4*s-flap, 0, 0);
    ctx.quadraticCurveTo(4*s, -4*s-flap, 9*s, 0);
    ctx.stroke();
  } else if (ev.type === 'plane'){
    // Contrail memudar + badan pesawat mungil
    const dir = ev.vx > 0 ? 1 : -1;
    ctx.scale(dir, 1);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,247,224,0.8)'; ctx.lineWidth = 2*s;
    ctx.beginPath(); ctx.moveTo(-14*s, 0); ctx.lineTo(-64*s, 0); ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#E8ECFF';
    ctx.beginPath(); ctx.ellipse(0, 0, 14*s, 3.5*s, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#8A93B8';
    ctx.fillRect(-2*s, -9*s, 5*s, 18*s);
    ctx.fillStyle = '#FFD02E';
    ctx.beginPath(); ctx.arc(11*s, 0, 1.6*s, 0, 6.283); ctx.fill();
  } else if (ev.type === 'balloon'){
    // Balon + keranjang
    ctx.globalAlpha = 0.9;
    const g = ctx.createRadialGradient(-4*s,-5*s,1, 0,0,14*s);
    g.addColorStop(0, '#7DF5A5'); g.addColorStop(1, '#0d7a3d');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 13*s, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(20,20,35,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-8*s, 9*s); ctx.lineTo(-5*s, 20*s);
    ctx.moveTo(8*s, 9*s); ctx.lineTo(5*s, 20*s);
    ctx.stroke();
    ctx.fillStyle = '#7a4a1e';
    ctx.fillRect(-6*s, 19*s, 12*s, 7*s);
  } else if (ev.type === 'meteor'){
    // Kepala pijar + ekor gradient
    const len = 70*s;
    const ang = Math.atan2(ev.vy, ev.vx);
    const tg = ctx.createLinearGradient(0, 0, -Math.cos(ang)*len, -Math.sin(ang)*len);
    tg.addColorStop(0, 'rgba(255,247,224,0.95)');
    tg.addColorStop(1, 'rgba(255,107,61,0)');
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = tg; ctx.lineWidth = 3*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(-Math.cos(ang)*len, -Math.sin(ang)*len); ctx.stroke();
    ctx.fillStyle = '#FFF7E0';
    ctx.beginPath(); ctx.arc(0, 0, 2.5*s, 0, 6.283); ctx.fill();
  } else if (ev.type === 'satellite'){
    // Bodi + 2 panel surya + lampu kedip
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#C8CFE8';
    ctx.fillRect(-5*s, -3.5*s, 10*s, 7*s);
    ctx.fillStyle = '#2A3F8F';
    ctx.fillRect(-16*s, -5*s, 10*s, 10*s);
    ctx.fillRect(6*s, -5*s, 10*s, 10*s);
    ctx.strokeStyle = 'rgba(200,207,232,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -3.5*s); ctx.lineTo(0, -9*s); ctx.stroke();
    const blink = 0.4 + 0.6*Math.abs(Math.sin(performance.now()*0.004 + ev.seed));
    ctx.globalAlpha = blink;
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.arc(0, -9*s, 1.8*s, 0, 6.283); ctx.fill();
  } else if (ev.type === 'debris'){
    // Puing poligon berputar
    ctx.globalAlpha = 0.7;
    ctx.rotate(performance.now()*0.001 + ev.seed);
    ctx.fillStyle = '#8A93B8';
    ctx.beginPath();
    ctx.moveTo(7*s, 0); ctx.lineTo(-5*s, 5*s); ctx.lineTo(-3*s, -6*s);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBackground(dt){
  updateSkyEvents(dt || 0.016);
  const t = clamp(-camY/9000, 0, 1);
  const sky = getSkyLayer(-camY);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, rgbStr(sky.top));
  g.addColorStop(0.55, rgbStr(sky.mid));
  g.addColorStop(1, rgbStr(sky.bot));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  drawStars(sky.starOpacity);
  drawNebulaBack(-camY);
  drawGalaxies(-camY);
  drawEarth(-camY);
  drawPlanets(-camY);
  drawBlackHole(-camY);
  // B1.2 (Hallmark): awan hanya milik lapisan bawah — penuh di h<400,
  // fade-out halus 400-500, hilang total di h>=500. Warna tetap token
  // Midnight yang terkunci (putih kebiruan desaturasi), tanpa hue baru.
  const hCloud = Math.max(0, -camY);
  // B1.2 revisi (Hallmark): penuh h<800, fade 800-1000, hilang >=1000.
  const cloudFade = hCloud < 800 ? 1 : (hCloud < 1000 ? 1-(hCloud-800)/200 : 0);
  if (cloudFade > 0){
    const pc2 = camY*0.5, cellH2 = 460;
    const j0 = Math.floor((pc2-150)/cellH2), j1 = Math.ceil((pc2+H+150)/cellH2);
    ctx.globalAlpha = 0.7*cloudFade;
    for (let i=j0;i<=j1;i++){
      drawCloud(hash(i*5.7)*(W+160)-80, i*cellH2 + hash(i*3.3)*260 - pc2, 0.7+hash(i*9.1)*0.8, (0.5-t*0.3)*cloudFade);
    }
    ctx.globalAlpha = 1;
  }
  for (const ev of skyEventList) drawSkyEvent(ev);
  ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W/2,H*0.42,H*0.25,W/2,H*0.5,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(4,5,16,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}
function drawCloud(x,y,s,a){
  if(a<=0) return;
  ctx.fillStyle = 'rgba(232,236,255,'+(a*0.8).toFixed(2)+')';
  ctx.beginPath();
  ctx.arc(x,y,34*s,0,6.283); ctx.arc(x+38*s,y+8*s,26*s,0,6.283);
  ctx.arc(x-36*s,y+9*s,24*s,0,6.283); ctx.arc(x+10*s,y-20*s,26*s,0,6.283);
  ctx.fill();
}
function drawPlatforms(){
  for (const p of platforms){
    const y = p.y - camY;
    if (y < -50 || y > H+50) continue;
    let c1,c2,edge;
    if (p.type==='base')        { c1='#d9a066'; c2='#7a4a1e'; edge='#3d2410'; }
    else if (p.type==='spring') { c1='#7DF5A5'; c2='#0d7a3d'; edge='#064d26'; }
    else if (p.type==='moving') { c1='#5aa8ff'; c2='#1e4fd8'; edge='#102a75'; }
    else                        { c1='#FFE27A'; c2='#c47a10'; edge='#6e4206'; }
    ctx.fillStyle = 'rgba(4,5,16,0.28)';
    roundRect(p.x+2,y+4,p.w,p.h,8); ctx.fill();
    const g = ctx.createLinearGradient(0,y,0,y+p.h);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle = g;
    roundRect(p.x,y,p.w,p.h,8); ctx.fill();
    ctx.fillStyle = 'rgba(255,247,224,0.65)';
    roundRect(p.x+5,y+2,p.w-10,3,2); ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 2;
    roundRect(p.x,y,p.w,p.h,8); ctx.stroke();
    if (p.type === 'spring'){
      ctx.strokeStyle = '#0a7a3a'; ctx.lineWidth = 2.2; ctx.lineCap='round';
      const cx = p.x+p.w/2;
      for (let k=-1;k<=1;k+=2){
        const bx = cx + k*16;
        ctx.beginPath();
        ctx.moveTo(bx-5,y+12); ctx.lineTo(bx,y+5); ctx.lineTo(bx+5,y+12);
        ctx.stroke();
      }
    }
    if (p.type === 'moving'){
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      const cx = p.x+p.w/2;
      ctx.beginPath();
      ctx.moveTo(cx-6,y+9); ctx.lineTo(cx+6,y+9); ctx.lineTo(cx,y+3);
      ctx.closePath(); ctx.fill();
    }
  }
}

/* ============================================================
   JELLY — Visual collectible dengan 6 warna Infinity Stone
   ============================================================ */
function drawJelly(cx, cy, scale, phase, colorIdx){
  const R = 12 * scale;
  const bob = Math.sin(phase) * 3 * scale;
  const palette = JELLY_COLORS[(colorIdx || 0) % JELLY_COLORS.length];

  ctx.save();
  ctx.translate(cx, cy + bob);

  const POINTS = 20;
  function blobPath(){
    ctx.beginPath();
    for (let i = 0; i <= POINTS; i++){
      const a = (i / POINTS) * Math.PI * 2;
      const wobble = 1 + Math.sin(a * 3 + phase * 1.5) * 0.07;
      const x = Math.cos(a) * R * wobble;
      const y = Math.sin(a) * R * wobble * 0.94;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // 1. Glow — berlapis: halo luar + core
  ctx.save();
  ctx.shadowColor = 'rgba(' + palette.glow + ', 0.85)';
  ctx.shadowBlur = 22 * scale;
  blobPath();
  ctx.fillStyle = palette.mid;
  ctx.fill();
  ctx.restore();

  // 2. Body
  ctx.save();
  blobPath();
  const g = ctx.createRadialGradient(
    -R * 0.3, -R * 0.4, R * 0.05,
    0, 0, R * 1.3
  );
  g.addColorStop(0,    palette.light);
  g.addColorStop(0.45, palette.mid);
  g.addColorStop(0.85, palette.mid);
  g.addColorStop(1,    palette.dark);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();

  // 3. Inner detail
  ctx.save();
  blobPath();
  ctx.clip();

  const sh = ctx.createRadialGradient(0, R * 0.5, 0, 0, R * 0.5, R * 1.0);
  sh.addColorStop(0, 'rgba(0, 0, 0, 0.35)');
  sh.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = sh;
  ctx.fillRect(-R * 1.4, 0, R * 2.8, R * 1.5);

  const hl = ctx.createRadialGradient(
    -R * 0.35, -R * 0.4, 0,
    -R * 0.35, -R * 0.4, R * 0.6
  );
  hl.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  hl.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = hl;
  ctx.beginPath();
  ctx.ellipse(-R * 0.35, -R * 0.4, R * 0.42, R * 0.32, -0.4, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  ctx.ellipse(R * 0.3, -R * 0.3, R * 0.13, R * 0.09, 0.4, 0, 6.283);
  ctx.fill();

  ctx.restore();

  // 4. Outline — crisp ink
  ctx.save();
  blobPath();
  ctx.strokeStyle = 'rgba(8,8,20,0.55)';
  ctx.lineWidth = 1.6 * scale;
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawCoins(){
  for (const c of coins){
    const y = c.y - camY;
    if (y < -50 || y > H+50) continue;
    drawJelly(c.x, y, 1, c.phase + performance.now()*0.003, c.colorIdx || 0);
  }
}
function drawParticles(){
  for (const p of particles){
    const a = clamp(p.life/p.max,0,1);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y-camY, p.size*a, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   KARAKTER — Iron Man power-up
   ============================================================ */
function drawCharacter(x,y,size,powered,squash,vx,skinId,opacity){
  const R = size/2, sq = squash||1;
  const cols = getSkin(skinId).colors;
  ctx.save();
  if (opacity != null) ctx.globalAlpha = opacity;
  ctx.translate(x,y); ctx.scale(1/sq, sq);

  /* ---------- Magnetic Aura ---------- */
  if (powered){
    const t = performance.now() * 0.006;

    ctx.save();
    ctx.rotate(t);
    ctx.strokeStyle = 'rgba(74,222,128,0.8)';
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, R*1.6, 0, 6.283);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.save();
    const ag = ctx.createRadialGradient(0, 0, R*0.7, 0, 0, R*2.0);
    ag.addColorStop(0, 'rgba(255,208,46,0.45)');
    ag.addColorStop(1, 'rgba(255,208,46,0)');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.arc(0, 0, R*2.0, 0, 6.283);
    ctx.fill();
    ctx.restore();

    for (let i=0; i<6; i++){
      const a = t*2 + i*1.047;
      const dist = R*1.25 + Math.sin(t*5 + i*1.3)*3;
      const alpha = 0.4 + Math.sin(t*6 + i)*0.4;
      ctx.fillStyle = 'rgba(255,226,122,' + alpha.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(Math.cos(a)*dist, Math.sin(a)*dist, 1.6, 0, 6.283);
      ctx.fill();
    }
  }

  /* ---------- Body ---------- */
  ctx.save();
  if (powered){
    ctx.shadowColor = '#FF4D4D';
    ctx.shadowBlur = 30;
  } else {
    ctx.shadowColor = 'rgba(4,5,16,0.45)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 4;
  }
  const g = ctx.createRadialGradient(-R*0.34,-R*0.44,R*0.12,0,0,R*1.28);
  if (powered){
    g.addColorStop(0,    '#ff8080');
    g.addColorStop(0.45, '#e01e1e');
    g.addColorStop(0.85, '#a01010');
    g.addColorStop(1,    '#5a0808');
  } else {
    g.addColorStop(0, cols[0]);
    g.addColorStop(0.55, cols[1]);
    g.addColorStop(1, cols[2]);
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, R, R*1.06, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();

  /* ---------- Armor Details ---------- */
  if (powered){
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, R, R*1.06, 0, 0, 6.283);
    ctx.clip();

    ctx.fillStyle = '#f5c518';
    ctx.beginPath();
    ctx.moveTo(-R*0.9,  -R*0.75);
    ctx.lineTo(-R*0.5,  -R*0.95);
    ctx.lineTo( R*0.5,  -R*0.95);
    ctx.lineTo( R*0.9,  -R*0.75);
    ctx.lineTo( R*0.7,  -R*0.58);
    ctx.lineTo(-R*0.7,  -R*0.58);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(-R*0.85, -R*0.82);
    ctx.lineTo(-R*0.55, -R*0.9);
    ctx.lineTo(-R*0.5,  -R*0.7);
    ctx.lineTo(-R*0.75, -R*0.66);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f5c518';
    ctx.beginPath();
    ctx.moveTo(-R*0.98, -R*0.15);
    ctx.lineTo(-R*0.85, -R*0.45);
    ctx.lineTo(-R*0.65, -R*0.30);
    ctx.lineTo(-R*0.78,  0);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo( R*0.98, -R*0.15);
    ctx.lineTo( R*0.85, -R*0.45);
    ctx.lineTo( R*0.65, -R*0.30);
    ctx.lineTo( R*0.78,  0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f5c518';
    ctx.beginPath();
    ctx.moveTo(-R*0.55, R*0.55);
    ctx.lineTo( 0,      R*0.80);
    ctx.lineTo( R*0.55, R*0.55);
    ctx.lineTo( R*0.42, R*0.45);
    ctx.lineTo( 0,      R*0.66);
    ctx.lineTo(-R*0.42, R*0.45);
    ctx.closePath();
    ctx.fill();

    const reactorY = R * 0.20;

    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(0, reactorY, R*0.22, 0, 6.283);
    ctx.fill();

    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, reactorY, R*0.22, 0, 6.283);
    ctx.stroke();

    const rg = ctx.createRadialGradient(0, reactorY, 0, 0, reactorY, R*0.19);
    rg.addColorStop(0,    '#FFF7E0');
    rg.addColorStop(0.35, '#c9f0ff');
    rg.addColorStop(0.7,  '#8ee3ff');
    rg.addColorStop(1,    '#00a8ff');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0, reactorY, R*0.19, 0, 6.283);
    ctx.fill();

    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#8ee3ff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(200,240,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, R*0.20, R*0.09, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- Feet ---------- */
  ctx.fillStyle = powered ? '#5a0808' : cols[2];
  ctx.beginPath(); ctx.ellipse(-R*0.45,R*1.0,R*0.28,R*0.16,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse( R*0.45,R*1.0,R*0.28,R*0.16,0,0,6.283); ctx.fill();

  /* ---------- Fire Thrusters ---------- */
  if (powered){
    const flicker = 0.85 + Math.sin(performance.now()*0.02)*0.15;
    for (let k = -1; k <= 1; k += 2){
      const fx = k * R * 0.35;
      const fy = R * 1.05;
      const flameH = R * 0.85 * flicker * (0.9 + Math.random()*0.2);

      const og = ctx.createLinearGradient(fx, fy, fx, fy + flameH);
      og.addColorStop(0,   'rgba(255,180,60,0.95)');
      og.addColorStop(0.4, 'rgba(255,110,20,0.75)');
      og.addColorStop(1,   'rgba(255,80,20,0)');
      ctx.fillStyle = og;
      ctx.beginPath();
      ctx.moveTo(fx - R*0.16, fy);
      ctx.quadraticCurveTo(fx - R*0.10, fy + flameH*0.8, fx, fy + flameH);
      ctx.quadraticCurveTo(fx + R*0.10, fy + flameH*0.8, fx + R*0.16, fy);
      ctx.closePath();
      ctx.fill();

      const ig = ctx.createLinearGradient(fx, fy, fx, fy + flameH*0.7);
      ig.addColorStop(0,   'rgba(255,255,255,1)');
      ig.addColorStop(0.4, 'rgba(180,230,255,0.9)');
      ig.addColorStop(1,   'rgba(100,180,255,0)');
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.moveTo(fx - R*0.09, fy);
      ctx.quadraticCurveTo(fx - R*0.05, fy + flameH*0.5, fx, fy + flameH*0.65);
      ctx.quadraticCurveTo(fx + R*0.05, fy + flameH*0.5, fx + R*0.09, fy);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* ---------- Eyes ---------- */
  const eyeY = -R*0.16, eyeDX = R*0.37;
  const lookX = clamp((vx||0)/MOVE_SPEED,-1,1)*R*0.09;

  if (powered){
    ctx.save();
    ctx.shadowColor = '#8ee3ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#e8f8ff';
    ctx.beginPath(); ctx.arc(-eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#1a3a5a';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX, eyeY+R*0.04, R*0.15, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX, eyeY+R*0.04, R*0.15, 0, 6.283); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX-R*0.05, eyeY-R*0.03, R*0.06, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX-R*0.05, eyeY-R*0.03, R*0.06, 0, 6.283); ctx.fill();
  } else {
    ctx.fillStyle = '#FFF7E0';
    ctx.beginPath(); ctx.arc(-eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();

    ctx.fillStyle = '#10142A';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX, eyeY+R*0.04, R*0.155, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX, eyeY+R*0.04, R*0.155, 0, 6.283); ctx.fill();

    ctx.fillStyle = 'rgba(255,247,224,0.95)';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX-R*0.05, eyeY-R*0.02, R*0.055, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX-R*0.05, eyeY-R*0.02, R*0.055, 0, 6.283); ctx.fill();
  }

  /* ---------- Blush ---------- */
  if (!powered){
    ctx.fillStyle = 'rgba(255,110,140,0.38)';
    ctx.beginPath(); ctx.ellipse(-R*0.64, R*0.24, R*0.19, R*0.12, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse( R*0.64, R*0.24, R*0.19, R*0.12, 0, 0, 6.283); ctx.fill();
  }

  /* ---------- Mouth ---------- */
  if (!powered){
    ctx.strokeStyle = '#10142A';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, R*0.28, R*0.30, 0.16*Math.PI, 0.84*Math.PI);
    ctx.stroke();
  }

  ctx.restore();
}

/* ---------- Entity Interpolation (remote players, 15Hz data -> 60fps render) ---------- */
const INTERP_DELAY_MS = 100; // render posisi ~100ms lebih "lama" dari data terbaru

function getInterpolatedPosition(pid){
  const p = net.players[pid];
  if (!p) return { x: 0, y: 0 };
  const h = p.history;
  if (!h || h.length < 2) return { x: p.x, y: p.y }; // pemain baru join: fallback posisi terakhir
  const target = performance.now() - INTERP_DELAY_MS;
  // cari indeks i sehingga h[i].t <= target <= h[i+1].t
  let i = h.length - 2;
  while (i > 0 && h[i].t > target) i--;
  const a = h[i], b = h[i + 1];
  const span = b.t - a.t;
  if (span <= 0) return { x: b.x, y: b.y };
  const f = Math.max(0, Math.min(1, (target - a.t) / span));
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
}

function drawRemotePlayers(){
  Object.keys(net.players).forEach(pid => {
    if (pid === net.myId) return;
    const p = net.players[pid];
    if (!p || !p.alive) return;
    const ip = getInterpolatedPosition(pid); // posisi halus hasil interpolasi
    drawCharacter(ip.x, ip.y - camY, 46, p.powerTimer > 0, 1, p.vx||0, p.skin||'classic');
    ctx.save();
    ctx.font = 'bold 11px Fredoka, system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(p.name).width;
    const ty = ip.y - camY - 40;
    ctx.fillStyle = 'rgba(7,9,24,0.72)';
    roundRect(ip.x - tw/2 - 6, ty - 9, tw + 12, 16, 8); ctx.fill();
    ctx.fillStyle = '#FFD02E';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.name, ip.x, ty);
    ctx.restore();
  });
}

function drawPauseButton(){
  const b = PAUSE_BTN;
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#0B1020'; roundRect(b.x,b.y,b.w,b.h,10); ctx.fill();
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = 'rgba(255,247,224,0.5)'; ctx.lineWidth = 1.6;
  roundRect(b.x,b.y,b.w,b.h,10); ctx.stroke();
  ctx.fillStyle = '#FFF7E0';
  if (paused && net.mode === 'solo'){
    ctx.beginPath();
    ctx.moveTo(b.x+14, b.y+10);
    ctx.lineTo(b.x+14, b.y+30);
    ctx.lineTo(b.x+28, b.y+20);

  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPowerText(){
  if (powerTextTimer <= 0) return;
  const total = POWER_TEXT_DUR, t = powerTextTimer, elapsed = total - t;
  let alpha = 1;
  if (elapsed < 0.35) alpha = elapsed/0.35;
  else if (t < 0.45) alpha = t/0.45;
  alpha = clamp(alpha,0,1);
  const sc = 1 + Math.max(0, 1-elapsed/0.5)*0.45;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H*0.34); ctx.scale(sc,sc);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 30px Fredoka, system-ui, -apple-system, sans-serif';
  ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=6; ctx.lineJoin='round';
  ctx.strokeText("it's Blobby's time", 0, 0);
  ctx.shadowColor='rgba(255,208,46,0.95)'; ctx.shadowBlur=26;

}

    g.addColorStop(0, '#FFE27A');

  const setF = s => { ctx.font = '600 ' + s + 'px Fredoka, system-ui, sans-serif'; };
  setF(fsize);
  const maxW = r.w - 20;
  let tw = ctx.measureText(label).width;
  while (tw > maxW && fsize > 10){ fsize--; setF(fsize); tw = ctx.measureText(label).width; }
  ctx.fillStyle = primary ? '#2A1500' : '#FFF7E0';
  ctx.fillText(label, r.x+r.w/2, r.y+r.h/2+0.5);
  ctx.restore();
}

/* ============================================================
   MENU — dengan orbit 3D untuk jelly
   ============================================================ */
function drawMenuScene(dt){
  menuT += dt;
  camY = -3600;
  drawBackground();
  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold 52px Fredoka, system-ui, -apple-system, sans-serif';
  ctx.fillStyle='rgba(4,5,16,0.6)';
  ctx.fillText('Blobby', W/2+3, 173);
  const tg = ctx.createLinearGradient(0,110,0,175);
  tg.addColorStop(0,'#FFFFFF'); tg.addColorStop(0.5,'#FFD02E'); tg.addColorStop(1,'#FF6B3D');
  ctx.fillStyle=tg;
  ctx.fillText('Blobby', W/2, 170);
  ctx.font='bold 15px Fredoka, system-ui, -apple-system, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillText('Jelly Jump — Multiplayer', W/2, 205);
  ctx.restore();

  const by = 330 + Math.sin(menuT*3)*14;
  const sq = 1 + Math.sin(menuT*3)*0.05;

  // ─── Hitung posisi 6 jelly dalam orbit 3D ───
  const jellyOrbit = [];
  for (let i=0; i<6; i++){
    const a = menuT*0.7 + i*(Math.PI*2/6) + Math.sin(menuT*0.5 + i)*0.3;
    const depth = Math.sin(a);   // -1 (belakang) → +1 (depan)
    jellyOrbit.push({
      x: W/2 + Math.cos(a)*118,
      y: by + Math.sin(a)*42,
      depth,
      scale: 0.78 + (depth + 1) * 0.07,
      alpha: 0.85 + (depth + 1) * 0.075,
      colorIdx: i,
      phase: i*2
    });
  }
  // Urutkan dari belakang ke depan
  jellyOrbit.sort((a,b) => a.depth - b.depth);

  // ─── Layer 1: jelly di BELAKANG karakter ───
  for (const j of jellyOrbit){
    if (j.depth <= 0){
      ctx.save();
      ctx.globalAlpha = j.alpha;
      drawJelly(j.x, j.y, j.scale, j.phase + performance.now()*0.001, j.colorIdx);
      ctx.restore();
    }
  }

  // ─── Layer 2: karakter Blobby ───
  drawCharacter(W/2, by, 74, false, sq, 0, selectedSkin);

  // ─── Layer 3: jelly di DEPAN karakter ───
  for (const j of jellyOrbit){
    if (j.depth > 0){
      ctx.save();
      ctx.globalAlpha = j.alpha;
      drawJelly(j.x, j.y, j.scale, j.phase + performance.now()*0.001, j.colorIdx);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold 12px Fredoka, system-ui, -apple-system, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('👤 ' + myName, W/2, 425);
  ctx.fillStyle='rgba(255,224,102,0.95)';
  ctx.fillText('💰 ' + totalCoins + ' koin', W/2, 442);
  ctx.restore();

  drawBigBtn(MENU_SOLO, '🎯 Solo', true);
  drawBigBtn(MENU_MP, '🌐 Multiplayer', true);
  drawBigBtn(MENU_SKIN, '🎨 ' + getSkin(selectedSkin).name, false, 15);
  drawBigBtn(MENU_SET,  '⚙ Pengaturan', false, 15);

  if (best > 0){
    ctx.save();
    ctx.font = 'bold 12px Fredoka, system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('🏆 Solo Best: ' + best, W/2, H - 20);
    ctx.restore();
  }
}

function fallbackCopy(text, done){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    done();
  } catch(e){}
}
function copyRoomCode(){
  const code = net.roomCode || '';
  if (!code) return;
  const done = () => { copyFlashAt = performance.now(); sfxToggle(); haptic(15); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done, () => fallbackCopy(code, done));
    } else fallbackCopy(code, done);
  } catch(e){ fallbackCopy(code, done); }
}
