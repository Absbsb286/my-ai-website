/* ============================================================
   SEEDED RNG

let rngState = 1;
function setSeed(s){ rngState = (s|0) || 1; }
function rng(){
  rngState = (rngState * 1664525 + 1013904223) >>> 0;
  return rngState / 4294967296;
}
function rngRange(a,b){ return a + rng()*(b-a); }

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];

/* ---------- EMQX Serverless broker (replaces Trystero's default public relays) ----------
   Trystero 0.21.3 has no separate username/password option for the broker:
   credentials are embedded in the relay URL (wss://user:pass@host:port/path).
   mqtt.js parses them out of the URL and sends them in the MQTT CONNECT
   packet; the WebSocket connection itself carries no credentials. */
const EMQX_WS_URL =
  'wss://blobbyuser:BlobbyJelly2026!@c616191f.ala.asia-southeast1.emqxsl.com:8084/mqtt';
const EMQX_ROOM_CONFIG = {
  appId: 'blobby-jelly-v1',
  relayUrls: [EMQX_WS_URL],
  rtcConfig: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      {
        urls: [

async function loadTrystero(){
  if (net.module) return net.module;
  try {
    net.module = await import('https://unpkg.com/trystero@0.21.3/mqtt');
    return net.module;
  } catch(e1){
    try {
      net.module = await import('https://unpkg.com/trystero@0.21.3');
      return net.module;
    } catch(e2){
      throw new Error('Gagal load Trystero: ' + e1.message);
    }
  }
}

function netCleanup(){
  stopLobbyHeartbeat();
  if (net.room){ try { net.room.leave(); } catch(e){} }
  net.room = null;
  net.actions = {};
  net.players = {};
  net.connected = false;
  net.mode = 'solo';
  net.connecting = false;
  net.isHost = false;
  net.peerIdToPlayerId = {};
}

function startLobbyHeartbeat(){
  stopLobbyHeartbeat();
  net.heartbeat = setInterval(() => {
    if (state !== 'waiting' || !net.room){ stopLobbyHeartbeat(); return; }
    if (net.isHost) broadcastRoster();
    else {
      try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: net.isHost}); } catch(e){}
    }
  }, 1000);
}

function stopLobbyHeartbeat(){
  if (net.heartbeat){ clearInterval(net.heartbeat); net.heartbeat = null; }
}

async function createRoom(){
  if (net.connecting) return;
  netCleanup();
  net.mode = 'host';
  net.isHost = true;
  net.connecting = true;
  net.roomCode = genRoomCode();
  net.status = 'Menyiapkan room...';
  setScene('waiting');

  try {
    const {joinRoom} = await loadTrystero();
    net.room = joinRoom(EMQX_ROOM_CONFIG, net.roomCode);
    setupRoomHandlers();

    net.players[net.myId] = {
      x: W/2, y: START_Y, vx:0, vy:0, score:0, coinCount:0,
      powerTimer:0, alive:true, name: myName, skin: selectedSkin,
      ready:true, isMe:true, isHost:true
    };

    setTimeout(() => {
      net.connected = true;
      net.connecting = false;
      net.status = '';
    }, 600);
  } catch(e){
    net.status = 'Error: ' + e.message;
    net.connecting = false;
    setTimeout(()=>{ netCleanup(); setScene('mpMenu'); }, 3000);
  }
}

async function joinRoomNet(code){
  if (net.connecting) return;
  netCleanup();
  net.mode = 'client';
  net.isHost = false;
  net.connecting = true;
  net.roomCode = code.toUpperCase();
  net.status = 'Menghubungkan...';
  setScene('waiting');

  try {
    const {joinRoom} = await loadTrystero();
    net.room = joinRoom(EMQX_ROOM_CONFIG, net.roomCode);
    setupRoomHandlers();

    // Room validation timeout
    setTimeout(() => {
      // Cek apakah ada host yang terdeteksi
      const hasHost = Object.keys(net.players).some(
        pid => pid !== net.myId && net.players[pid].isHost
      );
      
      // Kalau tidak ada host DAN masih di scene waiting DAN belum connected
      if (!hasHost && state === 'waiting' && !net.connected) {
        net.status = '❌ Room tidak ditemukan. Pastikan kode benar dan host sudah membuat room.';
        // Tunggu 2 detik supaya user baca pesan, lalu kembali ke menu
        setTimeout(() => {
          netCleanup();
          setScene('mpMenu');
        }, 2000);
      }
    }, 5000);

    net.players[net.myId] = {
      x: W/2, y: START_Y, vx:0, vy:0, score:0, coinCount:0,
      powerTimer:0, alive:true, name: myName, skin: selectedSkin,
      ready:true, isMe:true, isHost:false
    };

    setTimeout(() => {
      try { net.actions.sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: false}); } catch(e){}
    }, 400);

    setTimeout(() => {
      if (!net.connected){
        net.connected = true;
        net.connecting = false;
        net.status = '';
      }
    }, 6000);
  } catch(e){
    net.status = 'Error: ' + e.message;
    net.connecting = false;
    setTimeout(()=>{ netCleanup(); setScene('mpMenu'); }, 3000);
  }
}

function setupRoomHandlers(){
  const room = net.room;
  const [sendHello, getHello]       = room.makeAction('hello');
  const [sendState, getState]       = room.makeAction('state');
  const [sendStart, getStart]       = room.makeAction('start');
  const [sendOver, getOver]         = room.makeAction('over');
  const [sendRoster, getRoster]     = room.makeAction('roster');
  net.actions = { sendHello, sendState, sendStart, sendOver, sendRoster };

  room.onPeerJoin((peerId) => {
    try { sendHello({id: net.myId, name: myName, skin: selectedSkin, isHost: net.isHost}, peerId); } catch(e){}
    if (net.isHost){
      setTimeout(() => { try { sendRoster({list: rosterList()}, peerId); } catch(e){} }, 200);
    }
  });

  room.onPeerLeave((peerId) => {
    const pid = net.peerIdToPlayerId[peerId];
    if (pid){
      delete net.players[pid];
      delete net.peerIdToPlayerId[peerId];
    }
    if (net.isHost) setTimeout(() => broadcastRoster(), 100);
  });

  getHello((data, peerId) => {
    net.peerIdToPlayerId[peerId] = data.id;
    const existing = net.players[data.id];
    if (existing){
      existing.name = data.name;
      existing.skin = data.skin;
      existing.isHost = data.isHost;
    } else {
      net.players[data.id] = {
        x: W/2, y: START_Y, vx:0, vy:0, score:0, coinCount:0,
        powerTimer:0, alive:true, name: data.name, skin: data.skin,
        ready:true, isMe:false, isHost: data.isHost, history: []
      };
    }
    net.connected = true;
    net.connecting = false;
    net.status = '';
    if (net.isHost) setTimeout(() => broadcastRoster(), 100);
  });

  getRoster((data) => {
    if (net.isHost) return;
    const newList = {};
    data.list.forEach(p => {
      if (p.id === net.myId){
        newList[p.id] = net.players[net.myId];
      } else if (net.players[p.id]){
        newList[p.id] = net.players[p.id];
        newList[p.id].name = p.name;
        newList[p.id].skin = p.skin;
        newList[p.id].isHost = p.isHost;
      } else {
        newList[p.id] = {
          x:W/2, y:START_Y, vx:0, vy:0, score:0, coinCount:0,
          powerTimer:0, alive:true, name:p.name, skin:p.skin,
          ready:true, isMe:false, isHost:p.isHost, history: []
        };
      }
    });
    net.players = newList;
  });

  getState((data) => {
    if (data.id === net.myId) return;
    let p = net.players[data.id];
    if (!p){
      p = {
        id: data.id,
        x: data.x || 0, y: data.y || 0, vx: data.vx || 0, vy: data.vy || 0,
        score: data.score || 0, coinCount: data.coinCount || 0,
        powerTimer: 0, alive: true,
        name: 'Pemain', skin: 'classic',
        isMe: false, isHost: false,
        history: []
      };
      net.players[data.id] = p;
    }
    if (p && !p.isMe){
      p.x = data.x;
      p.y = data.y;
      p.vx = data.vx;
      p.vy = data.vy;
      p.score = data.score;
      p.coinCount = data.coinCount;
      p.powerTimer = data.powerTimer;
      p.alive = data.alive;
      if (!Array.isArray(p.history)) p.history = [];
      p.history.push({t: performance.now(), x: data.x, y: data.y});
      if (p.history.length > 4) p.history.shift();
    }
  });

  getStart((data) => {
    if (net.isHost) return;
    if (raceState.phase !== 'idle') return;
    setSeed(data.seed);
    raceState.startAt = performance.now() + data.delay;
    startRace(true);
  });

  getOver((data) => {
    if (net.isHost) return;
    raceState.phase = 'ended';
    showResult(data.ranking);
  });
}

function rosterList(){
  return Object.keys(net.players).map(pid => ({
    id: pid,
    name: net.players[pid].name,
    skin: net.players[pid].skin,
    ready: net.players[pid].ready,
    isHost: net.players[pid].isHost
  }));
}

function broadcastRoster(){
  if (!net.isHost || !net.actions.sendRoster) return;
  try { net.actions.sendRoster({list: rosterList()}); } catch(e){}
}

function broadcastState(){
  if (!net.actions.sendState) return;
  try {
    net.actions.sendState({
      id: net.myId,
      x: player.x, y: player.y, vx: player.vx, vy: player.vy,
      score: score, coinCount: coinCount, powerTimer: powerTimer,
      alive: !raceState.localDead && raceState.phase === 'playing'
    });
  } catch(e){}
}

/* ---------- Audio ---------- */
let actx = null;
function AC(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(f,d,t,v,f2){
  if(!settings.sfx) return;
  const ac = AC(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t||'sine';
  o.frequency.setValueAtTime(f, ac.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime+d);
  g.gain.setValueAtTime(v||0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+d+0.02);
}

const music = { timer:null, nextTime:0, step:0,
  MEL:[440,523.25,659.25,587.33,523.25,440,392,440,493.88,587.33,659.25,587.33,523.25,493.88,440,392],
  BAS:[110,110,87.31,87.31,98,98,82.41,82.41,110,110,87.31,87.31,98,98,82.41,82.41] };
function playNote(f,time,dur,type,vol){
  const ac = AC(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, time);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(time); o.stop(time+dur+0.03);
}
function musicTick(){
  if(!settings.music) return;
  const ac = AC(); if(!ac || ac.state==='suspended') return;
  while (music.nextTime < ac.currentTime + 0.25){
    const s = music.step % 16;
    playNote(music.MEL[s], music.nextTime, 0.20, 'triangle', 0.022);
    playNote(music.BAS[s], music.nextTime, 0.24, 'sawtooth', 0.026);
    if(s%4===0) playNote(90, music.nextTime, 0.09, 'sine', 0.045);
    music.step++; music.nextTime += 0.22;
  }
}
function startMusic(){ if(music.timer) return; const ac=AC(); if(!ac) return;
  music.nextTime = ac.currentTime+0.05; music.step=0;
  music.timer = setInterval(musicTick, 60); }
function stopMusic(){ if(music.timer){ clearInterval(music.timer); music.timer=null; } }

const rand = (a,b)=>a+Math.random()*(b-a);

function hash(n){ const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }
function lerpColor(c1,c2,t){ return 'rgb('+Math.round(c1[0]+(c2[0]-c1[0])*t)+','+Math.round(c1[1]+(c2[1]-c1[1])*t)+','+Math.round(c1[2]+(c2[2]-c1[2])*t)+')'; }
function roundRect(x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function pointInRect(px,py,r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }

function spawnPlatform(y){
  const diff = clamp(-y/7000, 0, 1);
  const w = 84 - diff*24;
  const x = rngRange(10, W-w-10);
  let type = 'normal';
  const r = rng();
  if (r < 0.12 + diff*0.16) type = 'moving';
  else if (r < 0.19 + diff*0.16) type = 'spring';
  const p = { x, y, w, h:14, type,
    vx: type === 'moving' ? (rng()<0.5?-1:1)*rngRange(55,115) : 0 };
  platforms.push(p);
  if (rng() < 0.42){
    coins.push({
      x: x+w/2, y: y-40, taken:false,
      phase: rng()*6.283,
      colorIdx: Math.floor(rng()*JELLY_COLORS.length)
    });
  }
  return p;
}
function resetGame(seed){
  if (seed != null) setSeed(seed);
  player = { x: W/2, y: START_Y, vx:0, vy:0, w:46, h:46, sq:1 };
  platforms = []; coins = []; particles = [];
  camY = 0; coinCount = 0; coinsTotal = 0; powerTimer = 0; powerTextTimer = 0;
  score = 0; maxReach = START_Y; flash = 0; shake = 0;
  touchDir = 0; tapTimer = 0; tapSide = 0;
  keys.left = keys.right = false;
  drag.active = false; btnPointerId = null;
  airJumpsLeft = 1;

  platforms.push({ x:0, y:H-90, w:W, h:18, type:'base', vx:0 });
  topY = H - 90;
  for (let i=0;i<7;i++){ topY -= rngRange(85,122); spawnPlatform(topY); }
}

function burst(x,y,color,n,spread){
  spread = spread||300;
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, sp = rand(50,spread);
    particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80,
      life:rand(0.35,0.85), max:0.85, color, size:rand(2,5.5) });
  }
}

function doJump(){
  if (state !== 'race' || raceState.phase !== 'playing' || raceState.localDead) return;
  if (airJumpsLeft > 0){
    airJumpsLeft--;
    player.vy = DOUBLE_JUMP_V;
    player.sq = 0.78;
    sfxDJ(); haptic(15);
    burst(player.x, player.y + player.h/2, '#b3ecff', 10, 180);
  }
}

function updateGame(dt){
  for (const p of particles){
    p.life -= dt; p.vy += 950*dt; p.vx *= (1-1.6*dt);
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  if (particles.length > 400) particles.splice(0, particles.length-400);
  particles = particles.filter(p => p.life > 0);

  if (flash > 0) flash = Math.max(0, flash - dt*2.6);
  if (shake > 0) shake = Math.max(0, shake - dt*45);
  if (powerTextTimer > 0) powerTextTimer = Math.max(0, powerTextTimer - dt);
  if (tapTimer > 0){ tapTimer -= dt; if(tapTimer<=0) tapSide=0; }

  if (state !== 'race') return;
  if (raceState.phase !== 'playing') return;
  if (raceState.localDead) return;

  if (powerTimer > 0) powerTimer = Math.max(0, powerTimer - dt);
  const powered = powerTimer > 0;

  let dir = 0;
  if (keys.left)  dir -= 1;
  if (keys.right) dir += 1;
  if (touchDir !== 0) dir = touchDir;
  if (drag.active){
    const d = drag.x - player.x;
    if (Math.abs(d) > 7) dir = Math.sign(d);
    else dir = 0;
  }
  if (dir === 0 && tapSide !== 0) dir = tapSide;

  player.vx = dir * MOVE_SPEED;
  player.x += player.vx * dt;

  const hw = player.w/2;
  if (player.x < -hw) player.x = W + hw;
  if (player.x > W + hw) player.x = -hw;

  const prevY = player.y;
  player.vy += GRAV*dt;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  player.y += player.vy*dt;
  player.sq += (1 - player.sq) * Math.min(1, dt*13);

  if (player.vy > 0){
    const prevB = prevY + player.h/2;
    const curB  = player.y + player.h/2;
    let hit = null;
    for (const p of platforms){
      if (curB >= p.y && prevB <= p.y+4){
        if (player.x + hw*0.72 > p.x && player.x - hw*0.72 < p.x + p.w){
          if (!hit || p.y < hit.y) hit = p;
        }
      }
    }
    if (hit){
      let mult = 1;
      if (hit.type === 'spring'){ mult = 1.62; sfxSpring(); haptic(20); }
      else { sfxBounce(); haptic(12); }
      if (powered) mult = Math.max(mult, POWER_JUMP);
      player.vy = JUMP_V*mult;
      player.y  = hit.y - player.h/2;
      player.sq = 0.72;
      airJumpsLeft = 1;
      const col = hit.type === 'spring' ? '#7dffb0' : hit.type === 'moving' ? '#8fd0ff' : '#ffd98a';
      burst(player.x, hit.y, col, 7, 180);
    }
  }

  for (const p of platforms){
    if (p.type !== 'moving') continue;
    p.x += p.vx*dt;
    if (p.x < 6){ p.x = 6; p.vx *= -1; }
    if (p.x + p.w > W-6){ p.x = W-6-p.w; p.vx *= -1; }
  }

  if (powered){
    for (const c of coins){
      if (c.taken) continue;
      const dx = player.x-c.x, dy = player.y-c.y;
      const d = Math.hypot(dx,dy)||1;
      if (d < 230){ const pull = 1100*dt; c.x += dx/d*pull; c.y += dy/d*pull; }
    }
  }

  for (const c of coins){
    if (c.taken) continue;
    const dx = c.x-player.x, dy = c.y-player.y;
    if (dx*dx + dy*dy < 38*38){
      c.taken = true; coinCount++; coinsTotal++; score += 5;
      const palette = JELLY_COLORS[c.colorIdx || 0];
      burst(c.x, c.y, palette.mid, 11, 260);
      sfxCoin(); haptic(8);
      if (coinCount >= COINS_NEEDED){
        coinCount = 0; powerTimer = POWER_DURATION;
        powerTextTimer = POWER_TEXT_DUR; flash = 1; shake = 8;
        burst(player.x, player.y, '#ffe680', 34, 420);
        burst(player.x, player.y, '#fff6b0', 22, 300);
        sfxPower(); haptic([30,40,30,40,60]);
      }
    }
  }

  const targetCam = player.y - H*0.45;
  if (targetCam < camY) camY += (targetCam-camY)*Math.min(1, dt*11);

  while (topY > camY - 400){
    const diff = clamp(-topY/7000, 0, 1);
    topY -= rngRange(80, 128 + diff*22);
    spawnPlatform(topY);
  }
  platforms = platforms.filter(p => p.y < camY+H+180);
  coins     = coins.filter(c => !c.taken && c.y < camY+H+180);

  if (player.y < maxReach) maxReach = player.y;
  score = Math.max(0, Math.floor((START_Y - maxReach)/10)) + coinsTotal*5;

  if (player.y - camY > H + 70){
    onPlayerDied();
  }
}

function onPlayerDied(){
  if (net.mode === 'solo'){
    state = 'gameover';
    overT = 0;
    sfxOver();
    if (score > best){
      best = score;
      try{ localStorage.setItem('blobby_best', String(best)); }catch(e){}
    }
    raceState.lastEarnedCoins = coinsTotal;
    totalCoins += coinsTotal;
    saveSkins();
    stopMusic();
  } else {
    raceState.localDead = true;
    sfxOver();
    if (net.isHost){
      const myP = net.players[net.myId];
      if (myP) myP.alive = false;
      checkHostEndCondition();
    }
  }
}

function checkHostEndCondition(){
  let aliveCount = 0;
  Object.keys(net.players).forEach(pid => {
    if (net.players[pid].alive) aliveCount++;
  });
  if (aliveCount <= 1){
    endRaceHost();
  }
}

function endRaceHost(){
  if (raceState.phase === 'ended') return;
  raceState.phase = 'ended';
  stopMusic();

  const arr = Object.keys(net.players).map(pid => ({
    id: pid, name: net.players[pid].name, skin: net.players[pid].skin,
    score: net.players[pid].score, alive: net.players[pid].alive
  }));
  arr.sort((a,b) => {
    if (a.alive !== b.alive) return b.alive - a.alive;
    return b.score - a.score;
  });

  const ranking = arr.map((p,i) => {
    let bonus = 0;
    if (p.alive) bonus += BONUS_LAST_STANDING;
    if (i === 0) bonus += BONUS_WINNER;
    return { ...p, rank: i+1, bonus };
  });

  try { net.actions.sendOver({ranking}); } catch(e){}
  showResult(ranking);
}

function showResult(ranking){
  raceState.finalRanking = ranking;
  raceState.phase = 'ended';
  state = 'result';
  overT = 0;
  stopMusic();

  const myEntry = ranking.find(p => p.id === net.myId);
  const myCoins = coinsTotal;
  const myBonus = myEntry ? (myEntry.bonus || 0) : 0;
  raceState.lastEarnedCoins = myCoins;
  raceState.myBonus = myBonus;
  totalCoins += myCoins + myBonus;
  saveSkins();

  if (myEntry && myEntry.rank === 1){
    sfxWin();
    haptic([30, 50, 30, 50, 100]);
  } else {
    sfxLose();
  }
}

}

function drawPlatforms(){

      const cx = p.x+p.w/2;

/* ============================================================
   JELLY — Visual collectible dengan 6 warna Infinity Stone
   ============================================================ */
function drawJelly(cx, cy, scale, phase, colorIdx){
  const R = 12 * scale;
  const bob = Math.sin(phase) * 3 * scale;
  const palette = JELLY_COLORS[(colorIdx || 0) % JELLY_COLORS.length];

  ctx.save();
  ctx.translate(cx, cy + bob);

  const POINTS = 20;
  function blobPath(){
    ctx.beginPath();
    for (let i = 0; i <= POINTS; i++){
      const a = (i / POINTS) * Math.PI * 2;
      const wobble = 1 + Math.sin(a * 3 + phase * 1.5) * 0.07;
      const x = Math.cos(a) * R * wobble;
      const y = Math.sin(a) * R * wobble * 0.94;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // 1. Glow
  ctx.save();
  ctx.shadowColor = 'rgba(' + palette.glow + ', 0.9)';
  ctx.shadowBlur = 16 * scale;
  blobPath();
  ctx.fillStyle = palette.mid;
  ctx.fill();
  ctx.restore();

  // 2. Body
  ctx.save();
  blobPath();
  const g = ctx.createRadialGradient(
    -R * 0.3, -R * 0.4, R * 0.05,
    0, 0, R * 1.3
  );
  g.addColorStop(0,    palette.light);
  g.addColorStop(0.45, palette.mid);
  g.addColorStop(0.85, palette.mid);
  g.addColorStop(1,    palette.dark);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();

  // 3. Inner detail
  ctx.save();
  blobPath();
  ctx.clip();

  const sh = ctx.createRadialGradient(0, R * 0.5, 0, 0, R * 0.5, R * 1.0);
  sh.addColorStop(0, 'rgba(0, 0, 0, 0.35)');
  sh.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = sh;
  ctx.fillRect(-R * 1.4, 0, R * 2.8, R * 1.5);

  const hl = ctx.createRadialGradient(
    -R * 0.35, -R * 0.4, 0,
    -R * 0.35, -R * 0.4, R * 0.6
  );
  hl.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  hl.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = hl;
  ctx.beginPath();
  ctx.ellipse(-R * 0.35, -R * 0.4, R * 0.42, R * 0.32, -0.4, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  ctx.ellipse(R * 0.3, -R * 0.3, R * 0.13, R * 0.09, 0.4, 0, 6.283);
  ctx.fill();

  ctx.restore();

  // 4. Outline
  ctx.save();
  blobPath();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.lineWidth = 1.3 * scale;
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawCoins(){

}

function drawCharacter(x,y,size,powered,squash,vx,skinId,opacity){

  const cols = getSkin(skinId).colors;
  ctx.save();
  if (opacity != null) ctx.globalAlpha = opacity;

    ctx.save();
    ctx.rotate(t);
    ctx.strokeStyle = 'rgba(120,200,255,0.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, R*1.6, 0, 6.283);

      ctx.arc(Math.cos(a)*dist, Math.sin(a)*dist, 1.6, 0, 6.283);

  ctx.restore();

    ctx.beginPath();
    ctx.ellipse(0, 0, R, R*1.06, 0, 0, 6.283);
    ctx.clip();

    ctx.fillStyle = '#f5c518';
    ctx.beginPath();
    ctx.moveTo(-R*0.9,  -R*0.75);
    ctx.lineTo(-R*0.5,  -R*0.95);
    ctx.lineTo( R*0.5,  -R*0.95);
    ctx.lineTo( R*0.9,  -R*0.75);
    ctx.lineTo( R*0.7,  -R*0.58);
    ctx.lineTo(-R*0.7,  -R*0.58);

    ctx.fill();

    ctx.moveTo(-R*0.85, -R*0.82);

    ctx.lineTo(-R*0.5,  -R*0.7);
    ctx.lineTo(-R*0.75, -R*0.66);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f5c518';

    ctx.moveTo(-R*0.98, -R*0.15);
    ctx.lineTo(-R*0.85, -R*0.45);
    ctx.lineTo(-R*0.65, -R*0.30);
    ctx.lineTo(-R*0.78,  0);

    ctx.fill();

    ctx.lineTo( R*0.65, -R*0.30);

  ctx.beginPath(); ctx.ellipse( R*0.45,R*1.0,R*0.28,R*0.16,0,0,6.283); ctx.fill();

  /* ---------- Fire Thrusters ---------- */
  if (powered){
    const flicker = 0.85 + Math.sin(performance.now()*0.02)*0.15;
    for (let k = -1; k <= 1; k += 2){

      const fy = R * 1.05;
      const flameH = R * 0.85 * flicker * (0.9 + Math.random()*0.2);

      const og = ctx.createLinearGradient(fx, fy, fx, fy + flameH);
      og.addColorStop(0,   'rgba(255,180,60,0.95)');
      og.addColorStop(0.4, 'rgba(255,110,20,0.75)');
      og.addColorStop(1,   'rgba(255,80,20,0)');
      ctx.fillStyle = og;
      ctx.beginPath();
      ctx.moveTo(fx - R*0.16, fy);
      ctx.quadraticCurveTo(fx - R*0.10, fy + flameH*0.8, fx, fy + flameH);
      ctx.quadraticCurveTo(fx + R*0.10, fy + flameH*0.8, fx + R*0.16, fy);
      ctx.closePath();
      ctx.fill();

      const ig = ctx.createLinearGradient(fx, fy, fx, fy + flameH*0.7);
      ig.addColorStop(0,   'rgba(255,255,255,1)');
      ig.addColorStop(0.4, 'rgba(180,230,255,0.9)');
      ig.addColorStop(1,   'rgba(100,180,255,0)');
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.moveTo(fx - R*0.09, fy);
      ctx.quadraticCurveTo(fx - R*0.05, fy + flameH*0.5, fx, fy + flameH*0.65);
      ctx.quadraticCurveTo(fx + R*0.05, fy + flameH*0.5, fx + R*0.09, fy);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* ---------- Eyes ---------- */
  const eyeY = -R*0.16, eyeDX = R*0.37;
  const lookX = clamp((vx||0)/MOVE_SPEED,-1,1)*R*0.09;

  if (powered){
    ctx.save();
    ctx.shadowColor = '#8ee3ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#e8f8ff';
    ctx.beginPath(); ctx.arc(-eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#1a3a5a';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX, eyeY+R*0.04, R*0.15, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX, eyeY+R*0.04, R*0.15, 0, 6.283); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX-R*0.05, eyeY-R*0.03, R*0.06, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX-R*0.05, eyeY-R*0.03, R*0.06, 0, 6.283); ctx.fill();
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX, eyeY, R*0.31, 0, 6.283); ctx.fill();

    ctx.fillStyle = '#1d2138';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX, eyeY+R*0.04, R*0.155, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX, eyeY+R*0.04, R*0.155, 0, 6.283); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-eyeDX+lookX-R*0.05, eyeY-R*0.02, R*0.055, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeDX+lookX-R*0.05, eyeY-R*0.02, R*0.055, 0, 6.283); ctx.fill();
  }

  /* ---------- Blush ---------- */
  if (!powered){
    ctx.fillStyle = 'rgba(255,110,140,0.32)';
    ctx.beginPath(); ctx.ellipse(-R*0.64, R*0.24, R*0.19, R*0.12, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse( R*0.64, R*0.24, R*0.19, R*0.12, 0, 0, 6.283); ctx.fill();
  }

  /* ---------- Mouth ---------- */
  if (!powered){
    ctx.strokeStyle = '#1d2138';
    ctx.lineWidth = 2.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, R*0.28, R*0.30, 0.16*Math.PI, 0.84*Math.PI);
    ctx.stroke();
  }

  ctx.restore();
}

/* ---------- Entity Interpolation (remote players, 15Hz data -> 60fps render) ---------- */
const INTERP_DELAY_MS = 100; // render posisi ~100ms lebih "lama" dari data terbaru

function getInterpolatedPosition(pid){
  const p = net.players[pid];
  if (!p) return { x: 0, y: 0 };
  const h = p.history;
  if (!h || h.length < 2) return { x: p.x, y: p.y }; // pemain baru join: fallback posisi terakhir
  const target = performance.now() - INTERP_DELAY_MS;
  // cari indeks i sehingga h[i].t <= target <= h[i+1].t
  let i = h.length - 2;
  while (i > 0 && h[i].t > target) i--;
  const a = h[i], b = h[i + 1];
  const span = b.t - a.t;
  if (span <= 0) return { x: b.x, y: b.y };
  const f = Math.max(0, Math.min(1, (target - a.t) / span));
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
}

function drawRemotePlayers(){
  Object.keys(net.players).forEach(pid => {
    if (pid === net.myId) return;
    const p = net.players[pid];
    if (!p || !p.alive) return;
    const ip = getInterpolatedPosition(pid); // posisi halus hasil interpolasi
    drawCharacter(ip.x, ip.y - camY, 46, p.powerTimer > 0, 1, p.vx||0, p.skin||'classic');
    ctx.save();
    ctx.font = 'bold 11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(p.name).width;
    const ty = ip.y - camY - 40;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ip.x - tw/2 - 6, ty - 9, tw + 12, 16, 8); ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.name, ip.x, ty);
    ctx.restore();
  });
}

    roundRect(bx,by,bw,bh,6.5); ctx.fill();

    roundRect(bx,by,Math.max(2,bw*frac),bh,6.5); ctx.fill();
    ctx.textAlign='center';
    ctx.font='bold 13px system-ui, -apple-system, sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('⚡ MEGA Blobby ⚡  '+powerTimer.toFixed(1)+'s', W/2, by-11);
  }

  if (net.mode !== 'solo'){
    const remain = Math.max(0, Math.ceil(raceState.timeLeft));
    ctx.font = 'bold 14px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = remain <= 10 ? '#ff8080' : '#fff';
    ctx.fillText('⏱ ' + remain + 's', 15, 62);

    const lb = Object.keys(net.players).map(pid => ({
      id: pid,
      name: net.players[pid].name,
      score: net.players[pid].score,
      alive: net.players[pid].alive,
      isMe: pid === net.myId
    })).sort((a,b) => {
      if (a.alive !== b.alive) return b.alive - a.alive;
      return b.score - a.score;
    });

    const lbY = 68, rowH = 20, lbW = 160, lbX = W - lbW - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(lbX, lbY, lbW, rowH * lb.length + 10, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    roundRect(lbX, lbY, lbW, rowH * lb.length + 10, 8); ctx.stroke();

    lb.forEach((p, i) => {
      const y = lbY + 8 + i * rowH + rowH/2;
      ctx.font = (p.isMe ? 'bold ' : '') + '12px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = p.alive ? (p.isMe ? '#ffe066' : '#ffffff') : 'rgba(255,255,255,0.4)';
      const medal = i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : (i+1) + '. ';
      ctx.fillText(medal + p.name.slice(0, 12), lbX + 8, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = p.alive ? '#ffffff' : 'rgba(255,255,255,0.5)';
      ctx.fillText(p.alive ? String(p.score) : '💀', lbX + lbW - 8, y);
    });

    if (raceState.timeLeft <= 5 && raceState.phase === 'playing'){
      ctx.save();
      ctx.globalAlpha = 0.85 + Math.sin(performance.now()*0.02)*0.15;
      ctx.font = 'bold 80px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff5555';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 6;
      ctx.strokeText(Math.ceil(raceState.timeLeft), W/2, H/2);
      ctx.fillText(Math.ceil(raceState.timeLeft), W/2, H/2);
      ctx.restore();
    }
  }

  if (raceState.phase === 'countdown'){
    const t = raceState.startAt - performance.now();
    if (t > 0){
      const sec = Math.ceil(t / 1000);
      ctx.save();
      ctx.font = 'bold 100px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffe066';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 8;
      ctx.strokeText(sec, W/2, H/2);
      ctx.fillText(sec, W/2, H/2);
      ctx.restore();
    }
  }
  ctx.restore();
}

  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(cx,cy,BTN_R,0,6.283); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle = pressed ? '#fff6c0' : 'rgba(255,255,255,0.75)';

  ctx.beginPath(); ctx.arc(cx,cy,BTN_R,0,6.283); ctx.stroke();

    ctx.moveTo(cx-13*sc,cy); ctx.lineTo(cx+11*sc,cy-15*sc); ctx.lineTo(cx+11*sc,cy+15*sc);
  } else {
    ctx.moveTo(cx+13*sc,cy); ctx.lineTo(cx-11*sc,cy-15*sc); ctx.lineTo(cx-11*sc,cy+15*sc);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPowerText(){
  if (powerTextTimer <= 0) return;
  const total = POWER_TEXT_DUR, t = powerTextTimer, elapsed = total - t;
  let alpha = 1;
  if (elapsed < 0.35) alpha = elapsed/0.35;
  else if (t < 0.45) alpha = t/0.45;
  alpha = clamp(alpha,0,1);
  const sc = 1 + Math.max(0, 1-elapsed/0.5)*0.45;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H*0.34); ctx.scale(sc,sc);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 30px system-ui, -apple-system, sans-serif';
  ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=6; ctx.lineJoin='round';
  ctx.strokeText("it's Blobby's time", 0, 0);
  ctx.shadowColor='rgba(255,220,90,0.9)'; ctx.shadowBlur=22;

/* ============================================================
   MENU — dengan orbit 3D untuk jelly
   ============================================================ */
function drawMenuScene(dt){
  menuT += dt;
  camY = -3600;
  drawBackground();
  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold 52px system-ui, -apple-system, sans-serif';
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillText('Blobby', W/2+3, 173);
  const tg = ctx.createLinearGradient(0,110,0,175);
  tg.addColorStop(0,'#fff'); tg.addColorStop(0.5,'#ffe066'); tg.addColorStop(1,'#ff9f1c');
  ctx.fillStyle=tg;
  ctx.fillText('Blobby', W/2, 170);
  ctx.font='bold 15px system-ui, -apple-system, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillText('Jelly Jump — Multiplayer', W/2, 205);
  ctx.restore();

  const by = 330 + Math.sin(menuT*3)*14;
  const sq = 1 + Math.sin(menuT*3)*0.05;

  // ─── Hitung posisi 6 jelly dalam orbit 3D ───
  const jellyOrbit = [];
  for (let i=0; i<6; i++){
    const a = menuT*0.7 + i*(Math.PI*2/6) + Math.sin(menuT*0.5 + i)*0.3;
    const depth = Math.sin(a);   // -1 (belakang) → +1 (depan)
    jellyOrbit.push({
      x: W/2 + Math.cos(a)*118,
      y: by + Math.sin(a)*42,
      depth,
      scale: 0.78 + (depth + 1) * 0.07,
      alpha: 0.85 + (depth + 1) * 0.075,
      colorIdx: i,
      phase: i*2
    });
  }
  // Urutkan dari belakang ke depan
  jellyOrbit.sort((a,b) => a.depth - b.depth);

  // ─── Layer 1: jelly di BELAKANG karakter ───
  for (const j of jellyOrbit){
    if (j.depth <= 0){
      ctx.save();
      ctx.globalAlpha = j.alpha;
      drawJelly(j.x, j.y, j.scale, j.phase + performance.now()*0.001, j.colorIdx);
      ctx.restore();
    }
  }

  // ─── Layer 2: karakter Blobby ───
  drawCharacter(W/2, by, 74, false, sq, 0, selectedSkin);

  // ─── Layer 3: jelly di DEPAN karakter ───
  for (const j of jellyOrbit){
    if (j.depth > 0){
      ctx.save();
      ctx.globalAlpha = j.alpha;
      drawJelly(j.x, j.y, j.scale, j.phase + performance.now()*0.001, j.colorIdx);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold 12px system-ui, -apple-system, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('👤 ' + myName, W/2, 425);
  ctx.fillStyle='rgba(255,224,102,0.95)';
  ctx.fillText('💰 ' + totalCoins + ' koin', W/2, 442);
  ctx.restore();

  drawBigBtn(MENU_SOLO, '🎯 Solo', true);
  drawBigBtn(MENU_MP, '🌐 Multiplayer', true);
  drawBigBtn(MENU_SKIN, '🎨 Skin: ' + getSkin(selectedSkin).name, false);
  drawBigBtn(MENU_SET,  '⚙ Pengaturan', false);

  if (best > 0){
    ctx.save();
    ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('🏆 Solo Best: ' + best, W/2, H - 20);
    ctx.restore();
  }
}

let last = performance.now();
function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (state === 'race'){
    if (raceState.phase === 'countdown'){
      if (performance.now() >= raceState.startAt){
        raceState.phase = 'playing';
      }
    }
    if (raceState.phase === 'playing' && net.mode !== 'solo'){
      raceState.timeLeft -= dt;
      if (raceState.timeLeft <= 0){
        raceState.timeLeft = 0;
        if (net.isHost) endRaceHost();
        else raceState.phase = 'ended';
      }
    }
    updateGame(dt);

    if (net.isHost && raceState.phase === 'playing'){
      raceState.aliveCheckTimer -= dt;
      if (raceState.aliveCheckTimer <= 0){
        raceState.aliveCheckTimer = 0.5;
        checkHostEndCondition();
      }
    }

    net.lastSend += dt;
    if (net.lastSend > 0.066 && raceState.phase === 'playing'){
      net.lastSend = 0;
      const myP = net.players[net.myId];
      if (myP){
        myP.x = player.x; myP.y = player.y; myP.vx = player.vx; myP.vy = player.vy;
        myP.score = score; myP.coinCount = coinCount; myP.powerTimer = powerTimer;
        myP.alive = !raceState.localDead;
      }
      broadcastState();
    }
  }

  render(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', function(e){
  const k = e.key, c = e.code;
  if (k==='ArrowLeft'||c==='ArrowLeft'||k==='a'||k==='A'||c==='KeyA') keys.left = true;
  if (k==='ArrowRight'||c==='ArrowRight'||k==='d'||k==='D'||c==='KeyD') keys.right = true;

  if (state === 'race' && raceState.phase === 'playing'){
    if (k===' '||k==='Spacebar'||k==='ArrowUp'||k==='w'||c==='KeyW'||c==='Space'){
      e.preventDefault(); doJump();
    }
  } else if (state === 'menu'){
    if (k===' '||k==='Enter'){ e.preventDefault(); startSolo(); }
  } else if (state === 'gameover'){
    if (k===' '||k==='Enter'){ e.preventDefault(); startSolo(); }
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(k) !== -1) e.preventDefault();
}, { passive:false });
window.addEventListener('keyup', function(e){
  const k = e.key, c = e.code;
  if (k==='ArrowLeft'||c==='ArrowLeft'||k==='a'||k==='A'||c==='KeyA') keys.left = false;
  if (k==='ArrowRight'||c==='ArrowRight'||k==='d'||k==='D'||c==='KeyD') keys.right = false;
});

function logicalX(cx){ const r = canvas.getBoundingClientRect(); return ((cx-r.left)/r.width)*W; }
function logicalY(cy){ const r = canvas.getBoundingClientRect(); return ((cy-r.top)/r.height)*H; }
function hitBtn(lx,ly){
  if (Math.hypot(lx-BTN_LX, ly-BTN_Y) < BTN_R+8) return -1;
  if (Math.hypot(lx-BTN_RX, ly-BTN_Y) < BTN_R+8) return 1;
  return 0;
}

function startSolo(){
  net.mode = 'solo';
  net.players = {};
  net.players[net.myId] = { x:W/2, y:START_Y, vx:0, vy:0, score:0, coinCount:0, powerTimer:0, alive:true, name:myName, skin:selectedSkin, ready:true, isMe:true };
  raceState.localDead = false;
  raceState.myBonus = 0;
  raceState.lastEarnedCoins = 0;
  startRace(false);
}

function startRace(isMulti){
  state = 'race';
  raceState.phase = isMulti ? 'countdown' : 'playing';
  raceState.timeLeft = RACE_TIME;
  raceState.finalRanking = null;
  raceState.localDead = false;
  raceState.myBonus = 0;
  raceState.lastEarnedCoins = 0;
  raceState.aliveCheckTimer = 0.5;

  if (!isMulti){
    resetGame(Math.floor(Math.random()*2147483646)+1);
  } else {
    resetGame();
    net.players[net.myId] = net.players[net.myId] || {};
    const p = net.players[net.myId];
    p.x = player.x; p.y = player.y; p.vx = 0; p.vy = 0;
    p.score = 0; p.coinCount = 0; p.powerTimer = 0; p.alive = true;
    p.isMe = true;
  }
  const ac = AC(); if(ac && ac.state==='suspended') ac.resume();
  startMusic();
}

function hostStartRace(){
  if (!net.isHost) return;
  const seed = Math.floor(Math.random()*2147483646)+1;
  const delay = 3200;

  Object.keys(net.players).forEach(pid => {
    const p = net.players[pid];
    p.score = 0; p.coinCount = 0; p.powerTimer = 0; p.alive = true;
  });
  try { net.actions.sendStart({seed, delay}); } catch(e){}
  setTimeout(() => { try { net.actions.sendStart({seed, delay}); } catch(e){} }, 300);
  setTimeout(() => { try { net.actions.sendStart({seed, delay}); } catch(e){} }, 600);
  setSeed(seed);
  raceState.startAt = performance.now() + delay;
  startRace(true);
}

function setScene(s){
  state = s;
  if (s === 'waiting') startLobbyHeartbeat(); else stopLobbyHeartbeat();
  if (s === 'join'){
    roomInput.style.display = 'block';
    roomInput.value = '';
    setTimeout(()=>roomInput.focus(), 100);
  } else {
    roomInput.style.display = 'none';
    roomInput.blur();
  }
}

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  const ac = AC(); if (ac && ac.state==='suspended') ac.resume();
  const lx = logicalX(e.clientX), ly = logicalY(e.clientY);

  if (state === 'menu'){
    if (pointInRect(lx,ly,MENU_SOLO)){ sfxToggle(); startSolo(); return; }
    if (pointInRect(lx,ly,MENU_MP)){ sfxToggle(); setScene('mpMenu'); return; }
    if (pointInRect(lx,ly,MENU_SKIN)){ sfxToggle(); returnState='menu'; setScene('skins'); return; }
    if (pointInRect(lx,ly,MENU_SET)){ sfxToggle(); returnState='menu'; setScene('settings'); return; }
    return;
  }
  if (state === 'mpMenu'){
    if (pointInRect(lx,ly,MPM_CREATE)){ sfxToggle(); createRoom(); return; }
    if (pointInRect(lx,ly,MPM_JOIN)){ sfxToggle(); setScene('join'); return; }
    if (pointInRect(lx,ly,MPM_BACK)){ sfxToggle(); setScene('menu'); return; }
    return;
  }
  if (state === 'join'){
    if (pointInRect(lx,ly,JOIN_JOIN)){
      const code = (roomInput.value || '').trim().toUpperCase();
      if (code.length === 6){ sfxToggle(); joinRoomNet(code); }
      else { net.status = 'Kode harus 6 huruf'; }
      return;
    }
    if (pointInRect(lx,ly,JOIN_BACK)){ sfxToggle(); roomInput.blur(); setScene('mpMenu'); return; }
    return;
  }
  if (state === 'waiting'){
    if (net.isHost && net.connected && pointInRect(lx,ly,WAIT_START)){
      sfxToggle(); hostStartRace();
      return;
    }
    if (pointInRect(lx,ly,WAIT_LEAVE)){ sfxToggle(); netCleanup(); setScene('mpMenu'); return; }
    return;
  }
  if (state === 'result'){
    sfxToggle();
    netCleanup();
    setScene('menu');
    return;
  }
  if (state === 'gameover'){
    if (pointInRect(lx,ly,GO_RETRY)){ sfxToggle(); startSolo(); return; }
    if (pointInRect(lx,ly,GO_MENU)){ sfxToggle(); setScene('menu'); return; }
    return;
  }
  if (state === 'settings'){
    if (pointInRect(lx,ly,SET_BACK)){ sfxToggle(); setScene(returnState); return; }
    SETTINGS_ITEMS.forEach((item, i) => {
      if (pointInRect(lx,ly,settingsItemRect(i))){
        settings[item.id] = !settings[item.id];
        saveSettings(); sfxToggle(); haptic(15);
        if (item.id === 'music'){
          if (settings.music){ if (!music.timer && state !== 'menu') startMusic(); }
          else stopMusic();
        }
      }
    });
    return;
  }
  if (state === 'skins'){
    if (pointInRect(lx,ly,SKIN_BACK_R)){ sfxToggle(); setScene(returnState); return; }
    SKINS.forEach((sk, i) => {
      if (pointInRect(lx,ly,skinCardRect(i))){
        const owned = unlockedSkins.includes(sk.id);
        if (owned){
          if (selectedSkin !== sk.id){ selectedSkin = sk.id; saveSkins(); sfxToggle(); haptic(15); }
        } else if (totalCoins >= sk.cost){
          totalCoins -= sk.cost; unlockedSkins.push(sk.id); selectedSkin = sk.id;
          saveSkins(); sfxUnlock(); haptic([20,30,20,30,40]);
        } else { sfxToggle(); haptic([10,20,10]); }
      }
    });
    return;
  }
  if (state === 'race'){
    if (raceState.phase === 'ended' && raceState.finalRanking){
      showResult(raceState.finalRanking);
      return;
    }
    if (raceState.localDead) return;
    if (raceState.phase !== 'playing') return;

    const b = hitBtn(lx,ly);
    if (b !== 0){
      btnPointerId = e.pointerId; touchDir = b;
      if (canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
      return;
    }
    if (isTouch){
      tapSide = (lx < W/2) ? -1 : 1;
      tapTimer = 0.35;
      drag.active = true; drag.id = e.pointerId; drag.x = lx;
      if (canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
      return;
    }
    drag.active = true; drag.id = e.pointerId; drag.x = lx;
    if (canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    return;
  }
}, { passive:false });

canvas.addEventListener('pointermove', function(e){
  if (e.pointerId === drag.id && drag.active){
    e.preventDefault();
    drag.x = logicalX(e.clientX);
    if (isTouch && Math.abs(e.movementX||0) > 2) tapSide = 0;
  } else if (e.pointerId === btnPointerId){
    e.preventDefault();
    const lx = logicalX(e.clientX), ly = logicalY(e.clientY);
    const b = hitBtn(lx, ly);
    touchDir = b !== 0 ? b : 0;
  }
}, { passive:false });

function release(e){
  if (e.pointerId === drag.id){ drag.active = false; drag.id = null; }
  if (e.pointerId === btnPointerId){ btnPointerId = null; touchDir = 0; }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', e => {
  if (e.pointerId === btnPointerId){ btnPointerId = null; touchDir = 0; }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

let lastTapTime = 0;
canvas.addEventListener('touchstart', e => {
  if (state !== 'race' || raceState.phase !== 'playing' || raceState.localDead) return;
  const now = Date.now();
  if (now - lastTapTime < 280){ doJump(); e.preventDefault(); }
  lastTapTime = now;
}, { passive:false });

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });

roomInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    e.preventDefault();
    const code = (roomInput.value||'').trim().toUpperCase();
    if (code.length === 6){ joinRoomNet(code); }
    else { net.status = 'Kode harus 6 huruf'; }
  }
});

resetGame(Math.floor(Math.random()*2147483646)+1);
state = 'menu';
requestAnimationFrame(loop);

})();
</script>
